dataset: ds003947
description: "Cleaned -> analysis config for ds003947 psychosis contrasts"

input:
  cleaned_root: "../data/cleaned"

coordinate_contract: cohort_anchored

output:
  directory: "../data/analysis"
  filename_pattern: "{dataset}_{analysisType}_{timestamp}.parquet"
  timestamp_format: "%Y%m%d_%H%M%S"
  parquet:
    compression: snappy
    index: false

runtime:
  fail_on_missing_input: true
  continue_on_error: false

qc:
  require_finite_ok: true
  exclude_not_testable: true
  exclude_validity_limited: false

design:
  pairing_keys:
    - subject_id
    - session
    - run
  condition_column: condition
  group_column: medication_group

statistics:
  permutation_n: 2000
  bootstrap_n: 1000
  random_seed: 3947
  min_group_n: 3
  min_pairs: 3
  fdr_group_by:
    - contrast_name
    - analysis_type

blocks:
  global_mnps_3d:
    enabled: true
  trajectory_dynamics:
    enabled: true
  global_mnps_jacobian_3d:
    enabled: true
    validity:
      min:
        n_windows: 50
      max:
        jacobian_near_singular_rate: 0.1
      require_true:
        - eig_ok
  global_mnps_9d:
    enabled: true
  global_mnps_jacobian_9d:
    enabled: true
    validity:
      min:
        n_windows: 50
      max:
        jacobian_near_singular_rate: 0.1
      require_true:
        - eig_ok
  jacobian_metrics_3d_recording:
    enabled: true
    grain: subject_condition
    subject_aggregation_policy: identity
    aggregation_keys: [subject_id, condition]
    metrics: [mean_spectral_abscissa, mean_numerical_abscissa, mean_reactivity_gap, stable_reactive_fraction]
    metric_tiers:
      primary: [mean_spectral_abscissa, mean_numerical_abscissa, mean_reactivity_gap, stable_reactive_fraction]
      secondary: [mean_symmetric_rate_min, mean_henrici_departure]
      qc: [n_windows_total, n_windows_metrics_valid, jacobian_metrics_valid_fraction]
    validity:
      min:
        n_windows_metrics_valid: 50
  jacobian_metrics_9d_recording:
    enabled: true
    grain: subject_condition
    subject_aggregation_policy: identity
    aggregation_keys: [subject_id, condition]
    metrics: [mean_spectral_abscissa, mean_numerical_abscissa, mean_reactivity_gap, stable_reactive_fraction]
    metric_tiers:
      primary: [mean_spectral_abscissa, mean_numerical_abscissa, mean_reactivity_gap, stable_reactive_fraction]
      secondary: [mean_symmetric_rate_min, mean_henrici_departure]
      qc: [n_windows_total, n_windows_metrics_valid, jacobian_metrics_valid_fraction]
    validity:
      min:
        n_windows_metrics_valid: 50
  finite_time_response_3d_recording_horizon:
    enabled: true
    grain: subject_condition
    subject_aggregation_policy: identity
    aggregation_keys: [subject_id, condition]
    horizon_steps: 4
    metrics: [mean_g_max, mean_d_resp, mean_c_1]
    metric_tiers:
      primary: [mean_g_max, mean_d_resp, mean_c_1]
      secondary: [mean_gamma_1, mean_log_g_max]
      qc: [n_sequences_valid, n_sequences_candidate]
    validity:
      min:
        n_sequences_valid: 50
      require_true: [finite_ok]
  finite_time_response_9d_recording_horizon:
    enabled: true
    grain: subject_condition
    subject_aggregation_policy: identity
    aggregation_keys: [subject_id, condition]
    horizon_steps: 4
    metrics: [mean_g_max, mean_d_resp, mean_c_1]
    metric_tiers:
      primary: [mean_g_max, mean_d_resp, mean_c_1]
      secondary: [mean_gamma_1, mean_log_g_max, mean_transfer_cross, mean_transfer_self]
      qc: [n_sequences_valid, n_sequences_candidate]
    validity:
      min:
        n_sequences_valid: 50
      require_true: [finite_ok]
  transition_residual_summary_3d_recording:
    enabled: true
    grain: subject_condition
    subject_aggregation_policy: identity
    aggregation_keys: [subject_id, condition]
    metric_tiers:
      qc: [n_transitions_valid, transition_residual_mean_norm]
  transition_residual_summary_9d_recording:
    enabled: true
    grain: subject_condition
    subject_aggregation_policy: identity
    aggregation_keys: [subject_id, condition]
    metric_tiers:
      qc: [n_transitions_valid, transition_residual_mean_norm]
  transition_q_proxy_3d_recording:
    enabled: true
    grain: subject_condition
    subject_aggregation_policy: identity
    aggregation_keys: [subject_id, condition]
    metric_tiers:
      qc: [trace_Q, q_logdet_regularized, effective_rank]
  transition_q_proxy_9d_recording:
    enabled: true
    grain: subject_condition
    subject_aggregation_policy: identity
    aggregation_keys: [subject_id, condition]
    metric_tiers:
      qc: [trace_Q, q_logdet_regularized, effective_rank]
  local_dynamics_availability:
    enabled: false
  global_mnps_jacobian_9d_block_jacobian:
    enabled: true
  regional_3d:
    enabled: false
  regional_9d:
    enabled: false
  reachability_cones:
    enabled: false
    validity:
      min:
        tube_log_det_split_half_rho: 0.5
        tube_d_eff_split_half_rho: 0.5
        tube_log_det_split_half_n: 50
        tube_d_eff_split_half_n: 50
      max:
        pred_err_h1: 1.0
        near_singular_rate: 0.1
  tier2_emmi:
    enabled: false
  dist_summary:
    enabled: false
  tier2_jacobian:
    enabled: false
  tau_summary:
    enabled: false
  robust_summary:
    enabled: false
  features_raw:
    enabled: false
  features_robust_z:
    enabled: false

contrasts:
  - name: FEP_unmedicated_vs_Healthy
    left:
      medication_group: Healthy
    right:
      medication_group: FEP unmedicated
    subset:
      medication_group: [Healthy, FEP unmedicated]

  - name: FEP_medicated_vs_Healthy
    left:
      medication_group: Healthy
    right:
      medication_group: FEP medicated
    subset:
      medication_group: [Healthy, FEP medicated]

  - name: FEP_medicated_vs_FEP_unmedicated
    left:
      medication_group: FEP unmedicated
    right:
      medication_group: FEP medicated
    subset:
      medication_group: [FEP unmedicated, FEP medicated]
