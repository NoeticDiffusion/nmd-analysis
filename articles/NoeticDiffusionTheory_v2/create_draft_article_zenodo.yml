name: "Noetic Diffusion Theory: Neural State, Dynamical Accessibility, and the Geometry of Possible Futures"
subtitle: "A multiscale framework for rhythmically and contextually controlled neural dynamics"

description: >-
  <p>Noetic Diffusion Theory (NDT) proposes that neural states relevant to
  cognition and consciousness are characterized not only by present
  configuration, but by the structured distribution of futures available from
  that configuration. This property is <em>dynamical accessibility</em>: a
  control-dependent stochastic law over how activity tends to move, how
  fluctuations spread, which destinations remain open, and how the system
  responds to perturbation. Drift, diffusion geometry, local reactivity,
  short-horizon predictive spread, basin commitment, and finite-amplitude
  resilience are non-equivalent. Reduced coordinates need not be sufficient
  statistics for future dynamics; matched present states can have different
  future laws. Measurement charts are operational interfaces, not the theory.
  Three bounded empirical anchors (spindles, coma, DANDI 000458) constrain
  layers. NDT is not a consciousness scalar.</p>

