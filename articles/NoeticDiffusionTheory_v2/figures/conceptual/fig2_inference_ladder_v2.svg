   </g>
   <g id="text_23">
    <text style="fill: #546e7a; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="325.26" y="440.314269" transform="rotate(-0 325.26 440.314269)">Independent readout: IBL population decoder can pass while a discrete-flow operator stops.</text>
   </g>
   <g id="text_24">
    <text style="fill: #546e7a; font: 8.5px 'DejaVu Sans'; text-anchor: middle" x="325.26" y="461.270589" transform="rotate(-0 325.26 461.270589)">A claim-class-1 association does not license a stronger class. A plausible chart remains class 1 until residual and perturbation tests pass.</text>
