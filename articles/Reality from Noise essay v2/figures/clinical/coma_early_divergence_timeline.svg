<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Early divergence timeline in post-cardiac-arrest coma</title>
  <desc id="desc">Schematic summary of the current pilot pattern across the first 12 hours, emphasizing immediate reachability separation in hour 1 and later divergence in rotational and manifold redistribution metrics.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #475569; }
      .phase-title { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .phase-time { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1d4ed8; }
      .body { font-family: Arial, sans-serif; font-size: 17px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #475569; }
      .metric { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0f172a; }
      .good { fill: #2563eb; }
      .poor { fill: #dc2626; }
      .neutral { fill: #64748b; }
      .phase-a { fill: #dbeafe; stroke: #60a5fa; }
      .phase-b { fill: #eff6ff; stroke: #93c5fd; }
      .phase-c { fill: #fef3c7; stroke: #f59e0b; }
      .phase-d { fill: #ecfccb; stroke: #84cc16; }
    </style>
  </defs>

  <rect width="1400" height="860" fill="#f8fafc"/>

  <text x="70" y="60" class="title">Current pilot reading of the first 12 h: early reachability split, then broader divergence</text>
  <text x="70" y="95" class="subtitle">Schematic figure for the draft manuscript. Intended to be updated with full-cohort data while preserving the same temporal story.</text>

  <rect x="70" y="130" width="1260" height="80" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="165" class="phase-title">Working interpretation</text>
  <text x="100" y="193" class="body">The clearest immediate separation appears in reachability-style geometry at <tspan font-weight="700">0-1 h</tspan>, especially <tspan font-weight="700">tube_log_det_median</tspan>.</text>
  <text x="790" y="193" class="body">Rotation- and redistribution-related measures become clearer later, especially around <tspan font-weight="700">4-7 h</tspan>.</text>

  <rect x="70" y="250" width="295" height="460" rx="24" class="phase-a" stroke-width="2" filter="url(#shadow)"/>
  <rect x="385" y="250" width="285" height="460" rx="24" class="phase-b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="690" y="250" width="285" height="460" rx="24" class="phase-c" stroke-width="2" filter="url(#shadow)"/>
  <rect x="995" y="250" width="335" height="460" rx="24" class="phase-d" stroke-width="2" filter="url(#shadow)"/>

  <text x="95" y="290" class="phase-time">Phase 1: 0-1 h</text>
  <text x="95" y="320" class="phase-title">Immediate reachability split</text>
  <circle cx="102" cy="360" r="6" class="good"/>
  <text x="120" y="366" class="metric">tube_log_det_median</text>
  <text x="120" y="392" class="body">Strongest first-hour signal.</text>
  <text x="120" y="418" class="small">Good lower than Poor already in the first monitored hour.</text>
  <circle cx="102" cy="458" r="6" class="good"/>
  <text x="120" y="464" class="metric">tube_capture_gate_median</text>
  <text x="120" y="490" class="small">Early difference present, but later less stable.</text>
  <circle cx="102" cy="530" r="6" class="good"/>
  <text x="120" y="536" class="metric">q_ratio_h4_median</text>
  <text x="120" y="562" class="small">Also separates very early, with later directional complexity.</text>
  <path d="M 105 610 C 165 555, 235 555, 300 600" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M 105 640 C 165 525, 235 520, 300 560" fill="none" stroke="#dc2626" stroke-width="4"/>
  <text x="100" y="685" class="small good">Blue: Good</text>
  <text x="200" y="685" class="small poor">Red: Poor</text>

  <text x="410" y="290" class="phase-time">Phase 2: 1-4 h</text>
  <text x="410" y="320" class="phase-title">Early transition period</text>
  <circle cx="417" cy="360" r="6" class="neutral"/>
  <text x="435" y="366" class="metric">Reachability remains informative</text>
  <text x="435" y="392" class="small">The first-hour split does not disappear, but some metrics become less monotonic.</text>
  <circle cx="417" cy="448" r="6" class="neutral"/>
  <text x="435" y="454" class="metric">tube_d_eff_median</text>
  <text x="435" y="480" class="small">Shows an early trend, distributed across several early windows rather than one sharp hour.</text>
  <circle cx="417" cy="536" r="6" class="neutral"/>
  <text x="435" y="542" class="metric">Interpretation</text>
  <text x="435" y="568" class="small">This phase looks more like adjustment of the early split than like a second independent onset.</text>
  <path d="M 420 622 L 640 622" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="430" y="652" class="small">The first separation begins to recruit additional metric families.</text>

  <text x="715" y="290" class="phase-time">Phase 3: 4-7 h</text>
  <text x="715" y="320" class="phase-title">Secondary structural divergence</text>
  <circle cx="722" cy="360" r="6" class="poor"/>
  <text x="740" y="366" class="metric">rotational_power_median</text>
  <text x="740" y="392" class="small">Poor tends to remain higher; separation becomes clearer around 4-5 h.</text>
  <circle cx="722" cy="458" r="6" class="good"/>
  <text x="740" y="464" class="metric">d_n_median</text>
  <text x="740" y="490" class="small">Good begins to separate more clearly in manifold redistribution around 4-7 h.</text>
  <circle cx="722" cy="536" r="6" class="neutral"/>
  <text x="740" y="542" class="metric">Interpretation</text>
  <text x="740" y="568" class="small">Different metric families appear to report different phases of recovery-linked organization.</text>
  <path d="M 725 610 C 790 650, 855 645, 930 598" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M 725 590 C 790 540, 855 535, 930 575" fill="none" stroke="#dc2626" stroke-width="4"/>

  <text x="1020" y="290" class="phase-time">Phase 4: 7-12 h</text>
  <text x="1020" y="320" class="phase-title">Broader but more mixed separation</text>
  <circle cx="1027" cy="360" r="6" class="neutral"/>
  <text x="1045" y="366" class="metric">Reachability remains central</text>
  <text x="1045" y="392" class="small">tube_log_det_median continues to anchor the main story.</text>
  <circle cx="1027" cy="448" r="6" class="neutral"/>
  <text x="1045" y="454" class="metric">Secondary metrics persist</text>
  <text x="1045" y="480" class="small">rotational_power_median and d_n_median remain useful as supportive structure.</text>
  <circle cx="1027" cy="536" r="6" class="neutral"/>
  <text x="1045" y="542" class="metric">Caution</text>
  <text x="1045" y="568" class="small">By late first-half-day windows, some measures start to look less like simple group offsets.</text>
  <text x="1045" y="602" class="small">This phase should be framed as broader reorganization, not as a single uniform biomarker.</text>

  <path d="M 365 480 L 383 480" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 670 480 L 688 480" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 975 480 L 993 480" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="70" y="745" width="1260" height="75" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="95" y="778" class="phase-title">Suggested figure use in the manuscript</text>
  <text x="95" y="805" class="body">Use as an explanatory overview: hour 1 is led by reachability (`tube_log_det_median`), hours 4-7 add secondary Jacobian and redistribution divergence, and the later `7-12 h` period is broader but less reducible to a single metric.</text>
</svg>
