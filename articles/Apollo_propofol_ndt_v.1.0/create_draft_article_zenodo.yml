metadata:
  publication_type: preprint
  version: "1.0"
  notes: >-
    Exploratory NDT v1.0 secondary analysis of the Cambridge propofol sedation
    EEG (DOI 10.17863/cam.68959) in the frozen NeuralManifoldDynamics export
    neuralmanifolddynamics_Sedation-RestingState_20260918_075713. Public
    package contains the manuscript and S1-S5; S6 is an internal changelog and
    is excluded. Occupancy was promoted after inspection and is not a locked
    confirmatory endpoint. The impaired-versus-responsive contrast and
    matched-state future-law tests are not testable in this export. The
    analysis does not establish a consciousness measure, a
    depth-of-anaesthesia monitor, a biological mechanism, or the absence of a
    responsiveness association.
