name: "Propofol increases baseline-referenced spectral-state displacement: an exploratory analysis"
subtitle: "Exploratory secondary analysis of Cambridge propofol sedation EEG in a frozen NeuralManifoldDynamics export"

# max 80 words
description: >-
  <p>Exploratory reanalysis of 20-participant Cambridge propofol EEG from a
  frozen export. Baseline-referenced spectral-state displacement rose from
  2.71 at baseline to 4.07 at first sedation (18/20, <em>d</em><sub>z</sub>
  +1.15) and to 8.68 later (20/20, <em>d</em><sub>z</sub> +1.12), with
  incomplete recovery. This sample gave no evidence of a monotonic
  responsiveness link; the impaired arm (<em>n</em> = 7) left that contrast
  untestable. Matched-state tests of a changed future law were also
  untestable. The finding is present-state relocation, not a confirmatory result.</p>

