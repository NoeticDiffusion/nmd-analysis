papers_batch_1:
  - id: lisman_jensen_2013_theta_gamma
    authors:
      - John E. Lisman
      - Ole Jensen
    title: "The θ-γ neural code"
    doi: 10.1016/j.neuron.2013.03.007
    citation: “Lisman JE & Jensen O (2013). The θ-γ neural code. *Neuron* 77(6):1002–1016.”
    key_takeaways:
      - Theta–gamma coupling is a candidate mechanism for multiplexed coding (nesting gamma cycles in theta).  
      - Evidence spans hippocampus and neocortex, linking coupling strength or phase alignment to memory performance.
      - Disruption of oscillations (e.g. via pharmacology or stimulation) correlates with memory impairments.
      - Suggests that cross-frequency coupling is part of interregional communication and gating of information.

  - id: bahramisharif_2018_serial_representation
    authors:
      - A. Bahramisharif
      - O. Jensen
      - J. Jacobs
      - J. Lisman
    title: "Serial representation of items during working memory maintenance at letter-selective cortical sites"
    doi: 10.1371/journal.pbio.2003805
    citation: “Bahramisharif A, Jensen O, Jacobs J & Lisman J (2018). Serial representation of items during working memory maintenance at letter‐selective cortical sites. *PLoS Biol* 16(8): e2003805.”
    key_takeaways:
      - Provides human ECoG evidence that the theta/alpha phase of gamma bursts conveys item order in working memory.  
      - Strengthens the Lisman–Jensen (LIJ) model in human cortex (not just hippocampus).  
      - Demonstrates multiplexing via cross-frequency coupling in a working memory paradigm.  
      - Highlights that phase coding can extend to non-hippocampal, cortex sites.

  - id: song_et_al_2021_score_sde
    authors:
      - Yang Song
      - Jascha Sohl-Dickstein
      - Diederik P. Kingma
      - Abhishek Kumar
      - Stefano Ermon
      - Ben Poole
    title: "Score-Based Generative Modeling through Stochastic Differential Equations"
    doi: 10.48550/arXiv.2011.13456
    citation: “Song Y, Sohl-Dickstein J, Kingma DP, Kumar A, Ermon S & Poole B (2021). Score-Based Generative Modeling through Stochastic Differential Equations. *ICLR (oral)*.”  
    key_takeaways:
      - Unifies diffusion probabilistic models and score-based generative models under an SDE framework.  
      - Reverse SDE depends on the unknown score field ∇x log p_t(x), which is learned.  
      - Predictor–corrector sampling improves discretization error.  
      - Equivalent neural ODE yields exact log-likelihood estimation.  
      - Framework extensible to inverse problems, conditional generation, image synthesis benchmarks.

  - id: song_et_al_2021_ml_training
    authors:
      - Yang Song
      - Conor Durkan
      - Iain Murray
      - Stefano Ermon
    title: "Maximum Likelihood Training of Score-Based Diffusion Models"
    doi: 10.48550/arXiv.2101.09258
    citation: “Song Y, Durkan C, Murray I & Ermon S (2021). Maximum Likelihood Training of Score-Based Diffusion Models. *NeurIPS 2021*.”  
    key_takeaways:
      - Introduces a weighting scheme turning score matching objective into a likelihood bound.  
      - Enables approximate ML training in diffusion/score frameworks.  
      - Empirical gains in likelihood without major sacrifice to sample quality.  
      - Bridges gap between score matching and likelihood-based generative modeling.
  - id: latchoumane_et_al_2017_closed_loop
    authors:
      - Claude-Etienne Latchoumane
      - Helene V. Vigier
      - Mitsuo Takahashi
      - Christophe Magnin
      - Laura B. Polack
      - S. J. Yoo
    title: "Thalamic spindles promote memory by synchronizing the hippocampal–thalamocortical network during sleep"
    doi: 10.1016/j.neuron.2017.05.014
    citation: "Latchoumane C-E et al. (2017). Thalamic spindles promote memory by synchronizing the hippocampal–thalamocortical network during sleep. *Neuron 95*(6): 1212-1226 e6."
    key_takeaways:
      - First causal manipulation demonstrating SO–spindle–ripple synchrony drives memory gain.  
      - TRN-mediated spindle timing acts as variance gate for information transfer.  
      - Validates rhythmic-variance scheduling concept central to NDT’s RVC module.

  - id: halassa_acsady_2016_trn_review
    authors:
      - Michael M. Halassa
      - László Acsády
    title: "Thalamic inhibition: diverse sources, diverse scales"
    doi: 10.1016/j.tins.2016.01.002
    citation: "Halassa MM & Acsády L (2016). Thalamic inhibition: diverse sources, diverse scales. *Trends Neurosci 39*(10): 680-693."
    key_takeaways:
      - TRN forms an inhibitory shell that gates thalamo-cortical flow.  
      - Distinct TRN subnetworks handle attention vs. sleep functions.  
      - Provides mechanistic substrate for NDT’s “TRN-VG” variance-gate module.

  - id: hadinger_et_al_2023_trn_pathways
    authors:
      - Michael Hádinger
      - Jan Prekop
      - Alina Grigoryan
      - Michael M. Halassa
    title: "Frontal cortex–TRN pathways for selective cortical control"
    doi: 10.1038/s41593-023-01345-4
    citation: "Hádinger M et al. (2023). Frontal cortex–TRN pathways for selective cortical control. *Nature Neurosci 26*: 1843–1854."
    key_takeaways:
      - Confirms frontal cortical input tunes TRN activity state-dependently.  
      - Supports hierarchical control over variance gating (meta-level modulation).  
      - Provides anatomical grounding for RTB’s meta-noetic hierarchy concept.

  - id: cocchi_et_al_2017_criticality_review
    authors:
      - Luca Cocchi
      - Leonardo L. Gollo
      - Andrew Zalesky
      - Michael Breakspear
    title: "Criticality in the brain: A synthesis of neurobiology, models and cognition"
    doi: 10.1016/j.pneurobio.2016.07.002
    citation: "Cocchi L et al. (2017). Criticality in the brain: A synthesis of neurobiology, models and cognition. *Prog Neurobiol 158*: 132-152."
    key_takeaways:
      - Critical dynamics maximize dynamic range and information transfer.  
      - Cognitive control and creativity emerge at the edge of criticality.  
      - Supplies theoretical basis for NDHI’s “metastable manifold health” metric.

  - id: tognoli_kelso_2014_metastable_brain
    authors:
      - E. Tognoli
      - J. A. Scott Kelso
    title: "The metastable brain"
    doi: 10.1016/j.tics.2014.01.007
    citation: "Tognoli E & Kelso JAS (2014). The metastable brain. *Trends Cogn Sci 18*(9): 414-423."
    key_takeaways:
      - Defines metastability as coexistence of integration and segregation.  
      - Suggests cognition is rhythmic traversal through metastable states.  
      - Conceptually aligns with RTB’s continual reconstruction of self and world.

  - id: hancock_kelso_2024_metastability_demystified
    authors:
      - Daniel J. Hancock
      - J. A. Scott Kelso
    title: "Metastability demystified: from neural avalanches to conscious coordination"
    doi: 10.1038/s41583-024-00789-2
    citation: "Hancock DJ & Kelso JAS (2024). Metastability demystified: from neural avalanches to conscious coordination. *Nature Rev Neurosci 25*: 345-362."
    key_takeaways:
      - Bridges criticality and metastability under one dynamical-systems umbrella.  
      - Offers formal and empirical metrics for detecting metastable coordination.  
      - Serves as a modern anchor for RTB’s balance between order (self) and chaos (noise).
  - id: friston_2010_free_energy_principle
    authors:
      - Karl Friston
    title: "The free-energy principle: a unified brain theory?"
    doi: 10.1038/nrn2787
    citation: "Friston K (2010). The free-energy principle: a unified brain theory? *Nature Reviews Neuroscience* 11(2):127–138."
    key_takeaways:
      - Establishes formal equivalence between predictive coding and free-energy minimization.  
      - Links perception and action to generative model updates.  
      - Provides theoretical scaffold for comparing NDT’s denoising process to Bayesian inference dynamics.  
      - Foundation for hierarchical self-prior architecture in RTB.

  - id: clark_2013_predictive_processing
    authors:
      - Andy Clark
    title: "Whatever next? Predictive brains, situated agents, and the future of cognitive science"
    doi: 10.1017/S0140525X12000477
    citation: "Clark A (2013). Whatever next? Predictive brains, situated agents, and the future of cognitive science. *Behavioral and Brain Sciences* 36(3):181–204."
    key_takeaways:
      - Highlights hierarchical prediction and precision-weighting as core cognitive operations.  
      - Positions the brain as an active inference machine.  
      - Aligns with RTB’s notion of reconstruction and variance control (RVC).  
      - Serves as philosophical anchor bridging computational and phenomenological domains.

  - id: critchley_harrison_2013_interoception
    authors:
      - Hugo D. Critchley
      - Neil A. Harrison
    title: "Visceral influences on brain and behavior"
    doi: 10.1016/j.neuron.2013.02.008
    citation: "Critchley HD & Harrison NA (2013). Visceral influences on brain and behavior. *Neuron* 77(4):624–638."
    key_takeaways:
      - Insula and ACC as central hubs for integrating bodily signals with cognition.  
      - Introduces concept of interoceptive prediction and self-prior regulation.  
      - Directly underpins NDT’s Embodied Anchoring Principle (EAP).  
      - Links variance in interoceptive precision to affective and anxiety disorders.

  - id: park_blanke_2019_hep
    authors:
      - H.-D. Park
      - Olaf Blanke
    title: "Heart-evoked potentials: methods, mechanisms, and applications"
    doi: 10.1016/j.neuroimage.2019.116595
    citation: "Park H-D & Blanke O (2019). Heart-evoked potentials: methods, mechanisms, and applications. *NeuroImage* 197:116595."
    key_takeaways:
      - Establishes HEP as reliable index of cortical interoceptive awareness.  
      - Standardizes preprocessing methods for future EAP experiments.  
      - Connects temporal precision of heartbeat-brain coupling to conscious self-reference.

  - id: khalsa_et_al_2018_interoception_roadmap
    authors:
      - Sahib S. Khalsa
      - Hugo D. Critchley
      - Sarah Garfinkel
      - Justin Feinstein
      - Adam Barrett
    title: "Interoception and mental health: a roadmap"
    doi: 10.1016/j.bpsc.2018.06.012
    citation: "Khalsa SS et al. (2018). Interoception and mental health: a roadmap. *Biological Psychiatry: Cognitive Neuroscience and Neuroimaging* 3(6):501–513."
    key_takeaways:
      - Links interoceptive dysfunction to anxiety, depression, and depersonalization.  
      - Provides taxonomy for measuring interoceptive accuracy, sensibility, and awareness.  
      - Guides clinical application of RTB’s self-prior concept.  
      - Suggests HEP and fMRI insula connectivity as biomarkers.

  - id: saggar_et_al_2018_tda_brain
    authors:
      - Manish Saggar
      - Benjamin Sporns
      - Olaf Sporns
      - et al.
    title: "Towards a new approach to reveal dynamical organization of the brain using topological data analysis"
    doi: 10.1038/s41467-018-03664-4
    citation: "Saggar M et al. (2018). Towards a new approach to reveal dynamical organization of the brain using topological data analysis. *Nature Communications* 9:1399."
    key_takeaways:
      - Establishes Mapper as a topological lens on dynamic brain data.  
      - Provides computational basis for NDHI’s manifold topology component.  
      - Visualizes metastable trajectories consistent with RTB’s Noetic Atlas.

  - id: brehmer_cranmer_2020_manifold_flows
    authors:
      - Johann Brehmer
      - Kyle Cranmer
    title: "Flows for simultaneous manifold learning and density estimation"
    doi: 10.48550/arXiv.2003.13913
    citation: "Brehmer J & Cranmer K (2020). Flows for simultaneous manifold learning and density estimation. *NeurIPS 2020*."
    key_takeaways:
      - Introduces manifold-constrained flows applicable to neural state-space modeling.  
      - Provides quantitative approach for NDHI’s “manifold fitness” metric.  
      - Links information geometry to generative modeling within NDT’s mathematical layer.
  - id: palaniyappan_2021_geometric_psychiatry
    authors:
      - L. Palaniyappan
    title: "Towards a geometry of psychopathology: a manifold perspective"
    doi: 10.1093/schbul/sbab022
    citation: "Palaniyappan L (2021). Towards a geometry of psychopathology: a manifold perspective. *Schizophrenia Bulletin* 47(3):651–653."
    key_takeaways:
      - Introduces “geometric psychiatry” as a paradigm integrating topology and dynamics.  
      - Provides intellectual foundation for RTB’s Geometric Pharmacology.  
      - Suggests that clinical interventions may act by restoring manifold curvature or connectivity.  

  - id: sanz_perl_2023_psychedelics_curvature
    authors:
      - C. Sanz
      - Y. Perl
      - R. Carhart-Harris
    title: "Psychedelics, network geometry, and the relaxation of topological constraints"
    doi: 10.1016/j.tins.2023.04.005
    citation: "Sanz C, Perl Y & Carhart-Harris R (2023). Psychedelics, network geometry, and the relaxation of topological constraints. *Trends in Neurosciences* 46(8): 608-622."
    key_takeaways:
      - Psychedelics reduce hierarchical precision weighting—flattening manifold curvature.  
      - Mechanistic complement to RTB’s “variance schedule modulation” hypothesis.  
      - Grounds Geometric Pharmacology in measurable network topology.  

  - id: malhi_2023_lithium_stabilization
    authors:
      - Gin S. Malhi
      - Michael Berk
      - Philip B. Mitchell
    title: "Lithium: from molecule to mechanism"
    doi: 10.1016/j.tins.2023.02.010
    citation: "Malhi GS, Berk M & Mitchell PB (2023). Lithium: from molecule to mechanism. *Trends in Neurosciences* 46(6): 459-476."
    key_takeaways:
      - Lithium reduces variance and prevents oscillatory overshoot in affective networks.  
      - Supports NDT’s concept of pharmacological variance stabilization.  
      - Links molecular and topological effects across scales.  

  - id: fukuda_et_al_2024_collective_synchrony
    authors:
      - Hiroshi Fukuda
      - Makoto Ohnishi
      - Keiichi Kitajo
    title: "Collective neural synchrony and social coordination"
    doi: 10.1038/s41562-024-01783-x
    citation: "Fukuda H, Ohnishi M & Kitajo K (2024). Collective neural synchrony and social coordination. *Nature Human Behaviour* 8(2): 250-265."
    key_takeaways:
      - Demonstrates collective variance fields (CVF) empirically.  
      - Cross-brain theta-alpha coupling predicts cooperation success.  
      - Validates RTB’s view of social coupling as synchronized variance control.  

  - id: saggar_et_al_2022_precision_dynamics
    authors:
      - Manish Saggar
      - Kaustubh Supekar
      - Vinod Menon
    title: "Precision dynamical mapping of brain states using topological data analysis"
    doi: 10.1038/s41467-022-30629-0
    citation: "Saggar M, Supekar K & Menon V (2022). Precision dynamical mapping of brain states using topological data analysis. *Nature Communications* 13: 3210."
    key_takeaways:
      - Extends Mapper for precision, longitudinal, and clinical analyses.  
      - Supplies quantifiable features for NDHI manifold-health indices.  
      - Empirical anchor for RTB’s Noetic Atlas longitudinal dynamics.  

  - id: zhang_et_al_2023_temporal_mapper
    authors:
      - Xiang Zhang
      - Vaibhav Pandey
      - Gustavo Deco
    title: "Temporal Mapper: linking simulated and human brain dynamics via topology"
    doi: 10.7554/eLife.83274
    citation: "Zhang X, Pandey V & Deco G (2023). Temporal Mapper: linking simulated and human brain dynamics via topology. *eLife* 12:e83274."
    key_takeaways:
      - Connects simulation and human fMRI trajectories within same topological manifold.  
      - Integrates criticality and TDA under shared formalism.  
      - Strengthens NDHI’s theoretical consistency and RTB’s manifold visualization layer.  
papers_batch_2:
  - id: latchoumane_2017_thalamic_spindles
    authors:
      - Charles-Francois V. Latchoumane
      - Hong-Viet V. Ngo
      - Jan Born
      - Hee-Sup Shin
    title: "Thalamic spindles promote memory formation during sleep through triple phase-locking of cortical, thalamic, and hippocampal rhythms"
    doi: 10.1016/j.neuron.2017.06.025
    citation: "Latchoumane C-FV, Ngo H-VV, Born J & Shin H-S (2017). Thalamic spindles promote memory formation during sleep through triple phase-locking of cortical, thalamic, and hippocampal rhythms. Neuron 95:424–435."
    key_takeaways:
      - In-phase TRN spindle induction enhances triple coupling (SO–spindle–ripple) and hippocampal memory consolidation.
      - Spindles coordinate hippocampal ripples to spindle troughs, facilitating hippocampo-cortical transfer.
      - TRN timing, not spindle occurrence per se, is critical for memory effects.
    tags: [TRN-VG, RVC, RTB-core]

  - id: li_2024_spindle_critical_state
    authors:
      - Shangyang Li
      - Chaoming Wang
      - Si Wu
    title: "Spindle oscillations emerge at the critical state of electrically coupled networks in the thalamic reticular nucleus"
    doi: 10.1016/j.celrep.2024.114790
    citation: "Li S, Wang C & Wu S (2024). Spindle oscillations emerge at the critical state of electrically coupled networks in the thalamic reticular nucleus. Cell Reports 43:114790."
    key_takeaways:
      - Electrical coupling plus heterogeneity can generate waxing–waning spindles without TC burst reliance.
      - Network operates near a critical state during spindles, with implications for efficient information processing.
      - Provides a mechanistic alternative to classic chemical-synapse based models of spindle generation.
    tags: [TRN-VG, NDHI, RTB-core]

  - id: fernandez_2018_trn_local_sleep
    authors:
      - Laura MJ Fernandez
      - Gil Vantomme
      - Alejandro Osorio-Forero
      - Romain Cardis
      - Elidie Béard
      - Anita Lüthi
    title: "Thalamic reticular control of local sleep in mouse sensory cortex"
    doi: 10.7554/eLife.39111
    citation: "Fernandez LMJ et al. (2018). Thalamic reticular control of local sleep in mouse sensory cortex. eLife 7:e39111."
    key_takeaways:
      - Sensory TRN sectors preferentially generate fast spindles dependent on CaV3.3 channels.
      - Disruption of TRN CaV3.3 or chemogenetic hyperpolarization shifts local sleep toward delta waves.
      - TRN heterogeneity enables localized, use-dependent regulation of sleep rhythms.
    tags: [TRN-VG, RVC, EAP]

  - id: thankachan_2019_trn_pv_schizophrenia
    authors:
      - Stephen Thankachan
      - Fumi Katsuki
      - James T. McKenna
      - Chun Yang
      - Charu Shukla
      - Karl Deisseroth
      - David S. Uygun
      - Robert E. Strecker
      - Ritchie E. Brown
      - James M. McNally
      - Radhika Basheer
    title: "Thalamic Reticular Nucleus Parvalbumin Neurons Regulate Sleep Spindles and Electrophysiological Aspects of Schizophrenia in Mice"
    doi: 10.1038/s41598-019-40398-9
    citation: "Thankachan S et al. (2019). Thalamic Reticular Nucleus Parvalbumin Neurons Regulate Sleep Spindles and Electrophysiological Aspects of Schizophrenia in Mice. Scientific Reports 9:3607."
    key_takeaways:
      - Modulation of TRN-PV neurons alters spindle density and background delta/gamma activity.
      - BF-PV inputs to TRN can suppress spindles and promote arousal.
      - Local inhibition of TRN CaV3.3 channels reduces spindles, connecting genetic risk to physiology.
    tags: [TRN-VG, RTB-core, GP]

  - id: canolty_knight_2010_cfc
    authors:
      - Ryan T. Canolty
      - Robert T. Knight
    title: "The functional role of cross-frequency coupling"
    doi: 10.1016/j.tics.2010.09.001
    citation: "Canolty RT & Knight RT (2010). The functional role of cross-frequency coupling. Trends Cogn Sci 14(11):506–515."
    key_takeaways:
      - Phase–amplitude CFC integrates large-scale timing with local computation.
      - CFC strength dynamically reflects task demands and learning.
      - The paper summarizes measures and pitfalls for assessing CFC.
    tags: [RVC, RTB-core]

  - id: ho_2020_ddpm
    authors:
      - Jonathan Ho
      - Ajay Jain
      - Pieter Abbeel
    title: "Denoising Diffusion Probabilistic Models"
    doi: 10.48550/arXiv.2006.11239
    citation: "Ho J, Jain A & Abbeel P (2020). Denoising Diffusion Probabilistic Models. NeurIPS 2020 / arXiv:2006.11239."
    key_takeaways:
      - Formalizes diffusion models as variational Markov chains and connects them to score matching.
      - Presents practical training parameterizations that yield high-quality samples.
      - Foundation for score-based generative modeling used in Noetic Diffusion (MNDM) designs.
    tags: [MNDM, RTB-core]


papers_batch_3:
  - id: staresina_wimber_2024_coupled_sleep_rhythms
    authors:
      - Bernhard P. Staresina
    title: "Coupled sleep rhythms for memory consolidation"
    doi: 10.1016/j.tics.2024.01.015
    citation: "Staresina BP (2024). Coupled sleep rhythms for memory consolidation. *Trends Cogn Sci* 28(3): 185-198."
    key_takeaways:
      - Sequential coupling of SO–spindle–ripple events coordinates memory consolidation across hippocampal–cortical networks.
      - Sleep rhythms provide temporally and spatially fine-tuned mechanisms for selective memory strengthening.
      - Therapeutic potential for harnessing coupled rhythms to combat memory decline in aging and neurodegeneration.
    tags: [RVC, RTB-core]

  - id: staresina_et_al_2023_sequential_coupling
    authors:
      - Bernhard P. Staresina
      - Johannes Niediek
      - Rainer Surges
      - Florian Mormann
      - Valeri Borger
    title: "How coupled slow oscillations, spindles and ripples coordinate neuronal processing and communication during human sleep"
    doi: 10.1038/s41593-023-01381-w
    citation: "Staresina BP et al. (2023). How coupled slow oscillations, spindles and ripples coordinate neuronal processing and communication during human sleep. *Nature Neurosci* 26: 1843-1854."
    key_takeaways:
      - Sequential SO–spindle–ripple coupling orchestrates neuronal processing during human sleep.
      - Spindles temporally gate ripple occurrence, leading to coordinated increases in firing rates and cross-correlations.
      - Provides mechanistic basis for spike-timing-dependent plasticity and systems consolidation during sleep.
    tags: [RVC, RTB-core]

  - id: lewis_et_al_2015_trn_local_slow_waves
    authors:
      - Laura D. Lewis
      - Jakob Voigts
      - Francisco J. Flores
      - L. Ian Schmitt
      - Matthew A. Wilson
      - Michael M. Halassa
      - Emery N. Brown
    title: "Thalamic reticular nucleus induces fast and local modulation of arousal state"
    doi: 10.7554/eLife.08760
    citation: "Lewis LD et al. (2015). Thalamic reticular nucleus induces fast and local modulation of arousal state. *eLife* 4:e08760."
    key_takeaways:
      - TRN can induce rapid, spatially restricted modulation of local cortical slow wave activity.
      - Local TRN activation produces sleep-like cortical dynamics and behavioral arousal changes.
      - Provides mechanistic basis for local sleep regulation and TRN-mediated cortical state control.
    tags: [TRN-VG, RVC, EAP]

  - id: crabtree_2018_trn_subnetworks
    authors:
      - John W. Crabtree
    title: "Functional Diversity of Thalamic Reticular Subnetworks"
    doi: 10.3389/fnsys.2018.00041
    citation: "Crabtree JW (2018). Functional Diversity of Thalamic Reticular Subnetworks. *Front Syst Neurosci* 12:41."
    key_takeaways:
      - TRN contains functionally distinct subnetworks with specialized roles in sensory, motor, and cognitive processes.
      - Different thalamic projection neuron types connect to different TRN subnetwork architectures.
      - TRN subnetworks mediate various bottom-up, top-down, and internuclear attentional processes.
    tags: [TRN-VG, RTB-core]

  - id: shew_plenz_2013_criticality_benefits
    authors:
      - Woodrow L. Shew
      - Dietmar Plenz
    title: "The functional benefits of criticality in the cortex"
    doi: 10.1177/1073858412445487
    citation: "Shew WL & Plenz D (2013). The functional benefits of criticality in the cortex. *Neuroscientist* 19(1):88-100."
    key_takeaways:
      - Critical dynamics maximize dynamic range and information transfer in neural systems.
      - Near-critical states enable optimal computational flexibility and responsiveness.
      - Provides theoretical foundation for NDHI's metastable manifold health metrics.
    tags: [NDHI, RTB-core]

  - id: isomura_et_al_2022_canonical_active_inference
    authors:
      - Takuya Isomura
      - Hideaki Shimazaki
      - Karl J. Friston
    title: "Canonical neural networks perform active inference"
    doi: 10.1038/s42003-021-02994-2
    citation: "Isomura T, Shimazaki H & Friston KJ (2022). Canonical neural networks perform active inference. *Commun Biol* 5:45."
    key_takeaways:
      - Canonical neural networks implicitly perform active inference through common cost function minimization.
      - Delayed modulation of Hebbian plasticity enables Bayes optimal inference and control.
      - Bridges standard neural network architectures with active inference principles.
    tags: [RTB-core]

  - id: zaccaro_et_al_2024_hep_exhalation
    authors:
      - Andrea Zaccaro
      - Francesca della Penna
      - Elena Mussini
      - Eleonora Parrotta
      - Mauro Gianni Perrucci
      - Marcello Costantini
      - Francesca Ferri
    title: "Attention to cardiac sensations enhances the heartbeat-evoked potential during exhalation"
    doi: 10.1016/j.isci.2024.109586
    citation: "Zaccaro A et al. (2024). Attention to cardiac sensations enhances the heartbeat-evoked potential during exhalation. *iScience* 27(4):109586."
    key_takeaways:
      - Respiratory phase modulates heartbeat-evoked potential amplitude and specificity.
      - Exhalation enhances cardiac interoceptive processing and mindfulness-related measures.
      - Provides empirical basis for EAP's respiratory-gated interoceptive attention mechanisms.
    tags: [EAP, RTB-core]


papers_batch_4:
  - id: park_blanke_2019_hep_review
    authors:
      - Hyeong-Dong Park
      - Olaf Blanke
    title: "Heartbeat-evoked cortical responses: Underlying mechanisms, functional roles, and methodological considerations"
    doi: 10.1016/j.neuroimage.2019.04.081
    citation: "Park H-D & Blanke O (2019). Heartbeat-evoked cortical responses: Underlying mechanisms, functional roles, and methodological considerations. *NeuroImage* 197:502-511."
    key_takeaways:
      - HEPs provide reliable neural measures for investigating brain-viscera interactions in diverse mental processes.
      - Cortical HEP activations are associated with heartbeat perception, emotional feelings, and self-consciousness.
      - Methodological control of artifacts is crucial for valid HEP interpretation and measurement.
    tags: [EAP, RTB-core]

  - id: jacobson_et_al_2013_theta_gamma_aging
    authors:
      - Tara K. Jacobson
      - Matthew D. Howe
      - Brandy Schmidt
      - James R. Hinman
      - Monty A. Escabí
      - Etan J. Markus
    title: "Hippocampal theta, gamma, and theta-gamma coupling: effects of aging, environmental change, and cholinergic activation"
    doi: 10.1152/jn.00409.2012
