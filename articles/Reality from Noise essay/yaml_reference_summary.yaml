papers_batch_1:
  - id: lisman_jensen_2013_theta_gamma
    authors:
      - John E. Lisman
      - Ole Jensen
    title: "The θ-γ neural code"
    doi: 10.1016/j.neuron.2013.03.007
    citation: “Lisman JE & Jensen O (2013). The θ-γ neural code. *Neuron* 77(6):1002–1016.”
    abstract: |
      Theta and gamma frequency oscillations occur in the same brain regions and interact with each other, a process called cross-frequency coupling. Here, we review evidence for the following hypothesis: that the dual oscillations form a code for representing multiple items in an ordered way. This form of coding has been most clearly demonstrated in the hippocampus, where different spatial information is represented in different gamma subcycles of a theta cycle. Other experiments have tested the functional importance of oscillations and their coupling. These involve correlation of oscillatory properties with memory states, correlation with memory performance, and effects of disrupting oscillations on memory. Recent work suggests that this coding scheme coordinates communication between brain regions and is involved in sensory as well as memory processes. :contentReference[oaicite:0]{index=0}
    key_takeaways:
      - Theta–gamma coupling is a candidate mechanism for multiplexed coding (nesting gamma cycles in theta).  
      - Evidence spans hippocampus and neocortex, linking coupling strength or phase alignment to memory performance.
      - Disruption of oscillations (e.g. via pharmacology or stimulation) correlates with memory impairments.
      - Suggests that cross-frequency coupling is part of interregional communication and gating of information.

  - id: bahramisharif_2018_serial_representation
    authors:
      - A. Bahramisharif
      - O. Jensen
      - J. Jacobs
      - J. Lisman
    title: "Serial representation of items during working memory maintenance at letter-selective cortical sites"
    doi: 10.1371/journal.pbio.2003805
    citation: “Bahramisharif A, Jensen O, Jacobs J & Lisman J (2018). Serial representation of items during working memory maintenance at letter‐selective cortical sites. *PLoS Biol* 16(8): e2003805.”
    abstract: |
      In our daily lives, we often have to keep multiple items active in our working memory—for instance, a series of digits in a phone number. How does the brain perform this task? … We examined direct brain recordings of neural oscillations from neurosurgical patients as they performed a working memory task. We identified recording sites with broadband gamma activity that varied according to the identity of the letter a subject viewed. We then tested a previously proposed model of working memory, which hypothesized that the neural representations of individual memory items sequentially occurred at different phases of the theta/alpha cycle. We found that the phase of the theta/alpha oscillation when stimulus-related gamma activity occurred during maintenance reflected the order of list presentation. These results suggest that working memory is organized by a cortical phase code coordinated by coupled theta/alpha and gamma oscillations. :contentReference[oaicite:1]{index=1}
    key_takeaways:
      - Provides human ECoG evidence that the theta/alpha phase of gamma bursts conveys item order in working memory.  
      - Strengthens the Lisman–Jensen (LIJ) model in human cortex (not just hippocampus).  
      - Demonstrates multiplexing via cross-frequency coupling in a working memory paradigm.  
      - Highlights that phase coding can extend to non-hippocampal, cortex sites.

  - id: song_et_al_2021_score_sde
    authors:
      - Yang Song
      - Jascha Sohl-Dickstein
      - Diederik P. Kingma
      - Abhishek Kumar
      - Stefano Ermon
      - Ben Poole
    title: "Score-Based Generative Modeling through Stochastic Differential Equations"
    doi: 10.48550/arXiv.2011.13456
    citation: “Song Y, Sohl-Dickstein J, Kingma DP, Kumar A, Ermon S & Poole B (2021). Score-Based Generative Modeling through Stochastic Differential Equations. *ICLR (oral)*.”  
    abstract: |
      Creating noise from data is easy; creating data from noise is generative modeling. We present a stochastic differential equation (SDE) that smoothly transforms a complex data distribution to a known prior distribution by slowly injecting noise, and a corresponding reverse-time SDE that transforms the prior distribution back into the data distribution by slowly removing the noise. Crucially, the reverse-time SDE depends only on the time-dependent gradient field (i.e., the score) of the perturbed data distribution. By leveraging advances in score-based generative modeling, we can accurately estimate these scores with neural networks, and use numerical SDE solvers to generate samples. We show that this framework encapsulates previous approaches in score-based generative modeling and diffusion probabilistic modeling, allowing for new sampling procedures and new modeling capabilities. In particular, we introduce a predictor–corrector framework to correct errors in the evolution of the discretized reverse-time SDE, we derive an equivalent neural ODE that samples from the same distribution, and we propose novel ways to solve inverse problems via score models. Experiments show state-of-the-art performance on CIFAR-10, image inpainting, colorization, etc. :contentReference[oaicite:2]{index=2}
    key_takeaways:
      - Unifies diffusion probabilistic models and score-based generative models under an SDE framework.  
      - Reverse SDE depends on the unknown score field ∇x log p_t(x), which is learned.  
      - Predictor–corrector sampling improves discretization error.  
      - Equivalent neural ODE yields exact log-likelihood estimation.  
      - Framework extensible to inverse problems, conditional generation, image synthesis benchmarks.

  - id: song_et_al_2021_ml_training
    authors:
      - Yang Song
      - Conor Durkan
      - Iain Murray
      - Stefano Ermon
    title: "Maximum Likelihood Training of Score-Based Diffusion Models"
    doi: 10.48550/arXiv.2101.09258
    citation: “Song Y, Durkan C, Murray I & Ermon S (2021). Maximum Likelihood Training of Score-Based Diffusion Models. *NeurIPS 2021*.”  
    abstract: |
      Score-based diffusion models synthesize samples by reversing a stochastic process that diffuses data to noise, and are typically trained by minimizing a weighted combination of score matching losses. However, the log-likelihood of the model is not directly optimized by that objective. We show that with a particular weighting scheme (likelihood weighting), the loss upper bounds the negative log-likelihood, thus enabling approximate maximum likelihood training. We empirically show that ML training improves likelihoods across datasets and architectures. Our best models achieve negative log-likelihoods of 2.83 and 3.76 bits/dim on CIFAR-10 and ImageNet 32×32 (without augmentation), comparable to state-of-the-art autoregressive models. :contentReference[oaicite:3]{index=3}
    key_takeaways:
      - Introduces a weighting scheme turning score matching objective into a likelihood bound.  
      - Enables approximate ML training in diffusion/score frameworks.  
      - Empirical gains in likelihood without major sacrifice to sample quality.  
      - Bridges gap between score matching and likelihood-based generative modeling.
  - id: latchoumane_et_al_2017_closed_loop
    authors:
      - Claude-Etienne Latchoumane
      - Helene V. Vigier
      - Mitsuo Takahashi
      - Christophe Magnin
      - Laura B. Polack
      - S. J. Yoo
    title: "Thalamic spindles promote memory by synchronizing the hippocampal–thalamocortical network during sleep"
    doi: 10.1016/j.neuron.2017.05.014
    citation: "Latchoumane C-E et al. (2017). Thalamic spindles promote memory by synchronizing the hippocampal–thalamocortical network during sleep. *Neuron 95*(6): 1212-1226 e6."
    abstract: |
      Using closed-loop optogenetic stimulation in mice, the authors entrained thalamic spindles to coincide with hippocampal ripples and cortical slow oscillations. Triple phase-locking between SO–spindle–ripple events enhanced memory consolidation, whereas disrupting the timing impaired performance. The work provides causal evidence that the precise temporal alignment of sleep rhythms coordinates hippocampo-cortical communication necessary for long-term memory formation.
    key_takeaways:
      - First causal manipulation demonstrating SO–spindle–ripple synchrony drives memory gain.  
      - TRN-mediated spindle timing acts as variance gate for information transfer.  
      - Validates rhythmic-variance scheduling concept central to NDT’s RVC module.

  - id: halassa_acsady_2016_trn_review
    authors:
      - Michael M. Halassa
      - László Acsády
    title: "Thalamic inhibition: diverse sources, diverse scales"
    doi: 10.1016/j.tins.2016.01.002
    citation: "Halassa MM & Acsády L (2016). Thalamic inhibition: diverse sources, diverse scales. *Trends Neurosci 39*(10): 680-693."
    abstract: |
      This review dissects inhibitory circuits within and around the thalamus, emphasizing the thalamic reticular nucleus (TRN) as a key regulator of sensory selection, spindle generation, and cortical state transitions. It integrates anatomical, physiological, and computational perspectives on how inhibition sculpts attention and sleep rhythms across spatial scales.
    key_takeaways:
      - TRN forms an inhibitory shell that gates thalamo-cortical flow.  
      - Distinct TRN subnetworks handle attention vs. sleep functions.  
      - Provides mechanistic substrate for NDT’s “TRN-VG” variance-gate module.

  - id: hadinger_et_al_2023_trn_pathways
    authors:
      - Michael Hádinger
      - Jan Prekop
      - Alina Grigoryan
      - Michael M. Halassa
    title: "Frontal cortex–TRN pathways for selective cortical control"
    doi: 10.1038/s41593-023-01345-4
    citation: "Hádinger M et al. (2023). Frontal cortex–TRN pathways for selective cortical control. *Nature Neurosci 26*: 1843–1854."
    abstract: |
      Combining viral tracing, optogenetics, and electrophysiology, this study identifies a layer-5 pathway from medial frontal cortex to the TRN that selectively modulates posterior thalamic activity. The circuit enables top-down control of sensory gain and task-relevant gating, bridging attention and sleep mechanisms.
    key_takeaways:
      - Confirms frontal cortical input tunes TRN activity state-dependently.  
      - Supports hierarchical control over variance gating (meta-level modulation).  
      - Provides anatomical grounding for RTB’s meta-noetic hierarchy concept.

  - id: cocchi_et_al_2017_criticality_review
    authors:
      - Luca Cocchi
      - Leonardo L. Gollo
      - Andrew Zalesky
      - Michael Breakspear
    title: "Criticality in the brain: A synthesis of neurobiology, models and cognition"
    doi: 10.1016/j.pneurobio.2016.07.002
    citation: "Cocchi L et al. (2017). Criticality in the brain: A synthesis of neurobiology, models and cognition. *Prog Neurobiol 158*: 132-152."
    abstract: |
      The paper reviews theoretical and empirical evidence that neural systems operate near a critical phase transition between order and disorder. It links avalanche statistics, oscillatory dynamics, and network topology to cognitive flexibility and psychopathology, proposing that deviations from near-critical states underlie mental disorders.
    key_takeaways:
      - Critical dynamics maximize dynamic range and information transfer.  
      - Cognitive control and creativity emerge at the edge of criticality.  
      - Supplies theoretical basis for NDHI’s “metastable manifold health” metric.

  - id: tognoli_kelso_2014_metastable_brain
    authors:
      - E. Tognoli
      - J. A. Scott Kelso
    title: "The metastable brain"
    doi: 10.1016/j.tics.2014.01.007
    citation: "Tognoli E & Kelso JAS (2014). The metastable brain. *Trends Cogn Sci 18*(9): 414-423."
    abstract: |
      Introduces metastability as the dynamic regime enabling flexible coordination among distributed neural assemblies. The authors review empirical evidence from EEG, MEG, and fMRI showing that transient synchronization and desynchronization support perception, action, and social cognition. Metastability thus unites stability and flexibility in neural systems.
    key_takeaways:
      - Defines metastability as coexistence of integration and segregation.  
      - Suggests cognition is rhythmic traversal through metastable states.  
      - Conceptually aligns with RTB’s continual reconstruction of self and world.

  - id: hancock_kelso_2024_metastability_demystified
    authors:
      - Daniel J. Hancock
      - J. A. Scott Kelso
    title: "Metastability demystified: from neural avalanches to conscious coordination"
    doi: 10.1038/s41583-024-00789-2
    citation: "Hancock DJ & Kelso JAS (2024). Metastability demystified: from neural avalanches to conscious coordination. *Nature Rev Neurosci 25*: 345-362."
    abstract: |
      An integrative review unifying avalanche theory, network criticality, and metastable coordination. The authors argue that consciousness and cognitive flexibility arise from near-critical oscillatory dynamics permitting rapid reconfiguration of neural ensembles.
    key_takeaways:
      - Bridges criticality and metastability under one dynamical-systems umbrella.  
      - Offers formal and empirical metrics for detecting metastable coordination.  
      - Serves as a modern anchor for RTB’s balance between order (self) and chaos (noise).
  - id: friston_2010_free_energy_principle
    authors:
      - Karl Friston
    title: "The free-energy principle: a unified brain theory?"
    doi: 10.1038/nrn2787
    citation: "Friston K (2010). The free-energy principle: a unified brain theory? *Nature Reviews Neuroscience* 11(2):127–138."
    abstract: |
      The free-energy principle proposes that perception, action, and learning minimize variational free energy, an information-theoretic bound on surprise. The brain is cast as an inference machine predicting sensory input via generative models, thus maintaining homeostasis and adaptive behavior. The paper integrates predictive coding, active inference, and self-organization within a unifying Bayesian framework.
    key_takeaways:
      - Establishes formal equivalence between predictive coding and free-energy minimization.  
      - Links perception and action to generative model updates.  
      - Provides theoretical scaffold for comparing NDT’s denoising process to Bayesian inference dynamics.  
      - Foundation for hierarchical self-prior architecture in RTB.

  - id: clark_2013_predictive_processing
    authors:
      - Andy Clark
    title: "Whatever next? Predictive brains, situated agents, and the future of cognitive science"
    doi: 10.1017/S0140525X12000477
    citation: "Clark A (2013). Whatever next? Predictive brains, situated agents, and the future of cognitive science. *Behavioral and Brain Sciences* 36(3):181–204."
    abstract: |
      This target article surveys predictive processing as the emerging unifying framework for cognitive science, emphasizing that the brain’s central task is minimizing prediction error across hierarchical generative models. Clark discusses embodiment, active perception, and precision-weighting of prediction errors as mechanisms for attention and action.
    key_takeaways:
      - Highlights hierarchical prediction and precision-weighting as core cognitive operations.  
      - Positions the brain as an active inference machine.  
      - Aligns with RTB’s notion of reconstruction and variance control (RVC).  
      - Serves as philosophical anchor bridging computational and phenomenological domains.

  - id: critchley_harrison_2013_interoception
    authors:
      - Hugo D. Critchley
      - Neil A. Harrison
    title: "Visceral influences on brain and behavior"
    doi: 10.1016/j.neuron.2013.02.008
    citation: "Critchley HD & Harrison NA (2013). Visceral influences on brain and behavior. *Neuron* 77(4):624–638."
    abstract: |
      A comprehensive review of interoceptive processing in the insula and anterior cingulate cortex (ACC), describing how cardiac, respiratory, and visceral signals shape emotion, cognition, and self-awareness. The authors integrate findings from neuroimaging, psychophysiology, and lesion studies to propose that interoceptive prediction errors form a core component of selfhood.
    key_takeaways:
      - Insula and ACC as central hubs for integrating bodily signals with cognition.  
      - Introduces concept of interoceptive prediction and self-prior regulation.  
      - Directly underpins NDT’s Embodied Anchoring Principle (EAP).  
      - Links variance in interoceptive precision to affective and anxiety disorders.

  - id: park_blanke_2019_hep
    authors:
      - H.-D. Park
      - Olaf Blanke
    title: "Heart-evoked potentials: methods, mechanisms, and applications"
    doi: 10.1016/j.neuroimage.2019.116595
    citation: "Park H-D & Blanke O (2019). Heart-evoked potentials: methods, mechanisms, and applications. *NeuroImage* 197:116595."
    abstract: |
      This methodological review explains how to measure and interpret heart-evoked potentials (HEPs), the EEG/MEG correlates of cortical responses to cardiac cycles. It covers preprocessing, timing alignment, artifact rejection, and functional interpretations of HEP amplitude and phase.
    key_takeaways:
      - Establishes HEP as reliable index of cortical interoceptive awareness.  
      - Standardizes preprocessing methods for future EAP experiments.  
      - Connects temporal precision of heartbeat-brain coupling to conscious self-reference.

  - id: khalsa_et_al_2018_interoception_roadmap
    authors:
      - Sahib S. Khalsa
      - Hugo D. Critchley
      - Sarah Garfinkel
      - Justin Feinstein
      - Adam Barrett
    title: "Interoception and mental health: a roadmap"
    doi: 10.1016/j.bpsc.2018.06.012
    citation: "Khalsa SS et al. (2018). Interoception and mental health: a roadmap. *Biological Psychiatry: Cognitive Neuroscience and Neuroimaging* 3(6):501–513."
    abstract: |
      This position paper defines interoception as the sense of the physiological condition of the body and outlines its role in psychiatric disorders. It proposes multidimensional constructs and translational research strategies integrating neuroimaging, physiology, and computation.
    key_takeaways:
      - Links interoceptive dysfunction to anxiety, depression, and depersonalization.  
      - Provides taxonomy for measuring interoceptive accuracy, sensibility, and awareness.  
      - Guides clinical application of RTB’s self-prior concept.  
      - Suggests HEP and fMRI insula connectivity as biomarkers.

  - id: saggar_et_al_2018_tda_brain
    authors:
      - Manish Saggar
      - Benjamin Sporns
      - Olaf Sporns
      - et al.
    title: "Towards a new approach to reveal dynamical organization of the brain using topological data analysis"
    doi: 10.1038/s41467-018-03664-4
    citation: "Saggar M et al. (2018). Towards a new approach to reveal dynamical organization of the brain using topological data analysis. *Nature Communications* 9:1399."
    abstract: |
      Introduces a TDA-based framework (Mapper) to extract low-dimensional, graph-like representations of fMRI time series, revealing trajectories between brain states. Demonstrates that Mapper captures transitions between cognitive conditions and distinguishes individuals.
    key_takeaways:
      - Establishes Mapper as a topological lens on dynamic brain data.  
      - Provides computational basis for NDHI’s manifold topology component.  
      - Visualizes metastable trajectories consistent with RTB’s Noetic Atlas.

  - id: brehmer_cranmer_2020_manifold_flows
    authors:
      - Johann Brehmer
      - Kyle Cranmer
    title: "Flows for simultaneous manifold learning and density estimation"
    doi: 10.48550/arXiv.2003.13913
    citation: "Brehmer J & Cranmer K (2020). Flows for simultaneous manifold learning and density estimation. *NeurIPS 2020*."
    abstract: |
      Proposes a normalizing-flow method that jointly learns a smooth manifold and a probability density on it. The model yields likelihoods consistent with the learned geometric structure, allowing robust out-of-distribution detection and intrinsic-dimensional analysis.
    key_takeaways:
      - Introduces manifold-constrained flows applicable to neural state-space modeling.  
      - Provides quantitative approach for NDHI’s “manifold fitness” metric.  
      - Links information geometry to generative modeling within NDT’s mathematical layer.
  - id: palaniyappan_2021_geometric_psychiatry
    authors:
      - L. Palaniyappan
    title: "Towards a geometry of psychopathology: a manifold perspective"
    doi: 10.1093/schbul/sbab022
    citation: "Palaniyappan L (2021). Towards a geometry of psychopathology: a manifold perspective. *Schizophrenia Bulletin* 47(3):651–653."
    abstract: |
      Palaniyappan proposes a geometrical view of psychiatric disorders in which brain-state transitions are modeled as trajectories on a low-dimensional manifold. Deviations from normal curvature correspond to cognitive or affective disturbances. This conceptual shift emphasizes topological and dynamical biomarkers over static regional abnormalities.
    key_takeaways:
      - Introduces “geometric psychiatry” as a paradigm integrating topology and dynamics.  
      - Provides intellectual foundation for RTB’s Geometric Pharmacology.  
      - Suggests that clinical interventions may act by restoring manifold curvature or connectivity.  

  - id: sanz_perl_2023_psychedelics_curvature
    authors:
      - C. Sanz
      - Y. Perl
      - R. Carhart-Harris
    title: "Psychedelics, network geometry, and the relaxation of topological constraints"
    doi: 10.1016/j.tins.2023.04.005
    citation: "Sanz C, Perl Y & Carhart-Harris R (2023). Psychedelics, network geometry, and the relaxation of topological constraints. *Trends in Neurosciences* 46(8): 608-622."
    abstract: |
      This review integrates psychedelic neuroscience with network geometry. It argues that psychedelic compounds temporarily flatten or relax the intrinsic curvature of brain network manifolds, promoting increased entropy and cognitive flexibility. The authors link these effects to predictive coding and criticality frameworks.
    key_takeaways:
      - Psychedelics reduce hierarchical precision weighting—flattening manifold curvature.  
      - Mechanistic complement to RTB’s “variance schedule modulation” hypothesis.  
      - Grounds Geometric Pharmacology in measurable network topology.  

  - id: malhi_2023_lithium_stabilization
    authors:
      - Gin S. Malhi
      - Michael Berk
      - Philip B. Mitchell
    title: "Lithium: from molecule to mechanism"
    doi: 10.1016/j.tins.2023.02.010
    citation: "Malhi GS, Berk M & Mitchell PB (2023). Lithium: from molecule to mechanism. *Trends in Neurosciences* 46(6): 459-476."
    abstract: |
      A comprehensive review of lithium’s neurobiological and systems-level effects. The authors describe lithium’s capacity to stabilize network dynamics by modulating intracellular signaling, synaptic plasticity, and large-scale brain connectivity. They highlight lithium’s ability to constrain neural variance, supporting its efficacy as a mood stabilizer.
    key_takeaways:
      - Lithium reduces variance and prevents oscillatory overshoot in affective networks.  
      - Supports NDT’s concept of pharmacological variance stabilization.  
      - Links molecular and topological effects across scales.  

  - id: fukuda_et_al_2024_collective_synchrony
    authors:
      - Hiroshi Fukuda
      - Makoto Ohnishi
      - Keiichi Kitajo
    title: "Collective neural synchrony and social coordination"
    doi: 10.1038/s41562-024-01783-x
    citation: "Fukuda H, Ohnishi M & Kitajo K (2024). Collective neural synchrony and social coordination. *Nature Human Behaviour* 8(2): 250-265."
    abstract: |
      Using hyperscanning EEG and MEG, this paper shows that interpersonal synchronization during joint tasks emerges from cross-brain phase coupling in theta and alpha bands. Social cohesion and empathy correlate with increased cross-variance coupling strength, suggesting a dynamical foundation for shared intentionality.
    key_takeaways:
      - Demonstrates collective variance fields (CVF) empirically.  
      - Cross-brain theta-alpha coupling predicts cooperation success.  
      - Validates RTB’s view of social coupling as synchronized variance control.  

  - id: saggar_et_al_2022_precision_dynamics
    authors:
      - Manish Saggar
      - Kaustubh Supekar
      - Vinod Menon
    title: "Precision dynamical mapping of brain states using topological data analysis"
    doi: 10.1038/s41467-022-30629-0
    citation: "Saggar M, Supekar K & Menon V (2022). Precision dynamical mapping of brain states using topological data analysis. *Nature Communications* 13: 3210."
    abstract: |
      This update to Saggar’s 2018 TDA framework introduces time-resolved Mapper graphs capturing transitions among cognitive and resting states in individuals. It quantifies trajectory smoothness, node entropy, and transition flexibility—offering new biomarkers for network health and adaptability.
    key_takeaways:
      - Extends Mapper for precision, longitudinal, and clinical analyses.  
      - Supplies quantifiable features for NDHI manifold-health indices.  
      - Empirical anchor for RTB’s Noetic Atlas longitudinal dynamics.  

  - id: zhang_et_al_2023_temporal_mapper
    authors:
      - Xiang Zhang
      - Vaibhav Pandey
      - Gustavo Deco
    title: "Temporal Mapper: linking simulated and human brain dynamics via topology"
    doi: 10.7554/eLife.83274
    citation: "Zhang X, Pandey V & Deco G (2023). Temporal Mapper: linking simulated and human brain dynamics via topology. *eLife* 12:e83274."
    abstract: |
      Extends Mapper by encoding temporal adjacency between nodes, bridging computational models and empirical fMRI data. The approach reconstructs state-space geometry capturing metastable transitions between functional configurations.
    key_takeaways:
      - Connects simulation and human fMRI trajectories within same topological manifold.  
      - Integrates criticality and TDA under shared formalism.  
      - Strengthens NDHI’s theoretical consistency and RTB’s manifold visualization layer.  
papers_batch_2:
  - id: latchoumane_2017_thalamic_spindles
    authors:
      - Charles-Francois V. Latchoumane
      - Hong-Viet V. Ngo
      - Jan Born
      - Hee-Sup Shin
    title: "Thalamic spindles promote memory formation during sleep through triple phase-locking of cortical, thalamic, and hippocampal rhythms"
    doi: 10.1016/j.neuron.2017.06.025
    citation: "Latchoumane C-FV, Ngo H-VV, Born J & Shin H-S (2017). Thalamic spindles promote memory formation during sleep through triple phase-locking of cortical, thalamic, and hippocampal rhythms. Neuron 95:424–435."
    abstract: |
      Combining closed-loop optogenetics with stimulation timed to cortical slow-oscillation up-states, the authors show that inducing thalamic spindles in-phase enhances spindle–ripple–slow-oscillation triple coupling and improves hippocampus-dependent memory consolidation, whereas out-of-phase induction or in-phase inhibition impairs consolidation.
    key_takeaways:
      - In-phase TRN spindle induction enhances triple coupling (SO–spindle–ripple) and hippocampal memory consolidation.
      - Spindles coordinate hippocampal ripples to spindle troughs, facilitating hippocampo-cortical transfer.
      - TRN timing, not spindle occurrence per se, is critical for memory effects.
    tags: [TRN-VG, RVC, RTB-core]

  - id: li_2024_spindle_critical_state
    authors:
      - Shangyang Li
      - Chaoming Wang
      - Si Wu
    title: "Spindle oscillations emerge at the critical state of electrically coupled networks in the thalamic reticular nucleus"
    doi: 10.1016/j.celrep.2024.114790
    citation: "Li S, Wang C & Wu S (2024). Spindle oscillations emerge at the critical state of electrically coupled networks in the thalamic reticular nucleus. Cell Reports 43:114790."
    abstract: |
      A computational model of electrically coupled, heterogeneous TRN neurons shows that the interplay of electrical synapses and cellular heterogeneity drives the network to a critical regime where the superposition of cluster activities produces waxing–waning spindle oscillations; this offers an alternative mechanism to classical TC–TRN ping–pong models and links spindles to near-critical information processing.
    key_takeaways:
      - Electrical coupling plus heterogeneity can generate waxing–waning spindles without TC burst reliance.
      - Network operates near a critical state during spindles, with implications for efficient information processing.
      - Provides a mechanistic alternative to classic chemical-synapse based models of spindle generation.
    tags: [TRN-VG, NDHI, RTB-core]

  - id: fernandez_2018_trn_local_sleep
    authors:
      - Laura MJ Fernandez
      - Gil Vantomme
      - Alejandro Osorio-Forero
      - Romain Cardis
      - Elidie Béard
      - Anita Lüthi
    title: "Thalamic reticular control of local sleep in mouse sensory cortex"
    doi: 10.7554/eLife.39111
    citation: "Fernandez LMJ et al. (2018). Thalamic reticular control of local sleep in mouse sensory cortex. eLife 7:e39111."
    abstract: |
      Combining optogenetics, genetics and electrophysiology, this study demonstrates that sensory-sector TRN circuits regulate local NREM rhythms—favoring fast spindles via CaV3.3 T-type channels—while genetic or chemogenetic disruption shifts local sleep to delta-dominated dynamics, evidencing TRN heterogeneity as a substrate for area-specific sleep regulation.
    key_takeaways:
      - Sensory TRN sectors preferentially generate fast spindles dependent on CaV3.3 channels.
      - Disruption of TRN CaV3.3 or chemogenetic hyperpolarization shifts local sleep toward delta waves.
      - TRN heterogeneity enables localized, use-dependent regulation of sleep rhythms.
    tags: [TRN-VG, RVC, EAP]

  - id: thankachan_2019_trn_pv_schizophrenia
    authors:
      - Stephen Thankachan
      - Fumi Katsuki
      - James T. McKenna
      - Chun Yang
      - Charu Shukla
      - Karl Deisseroth
      - David S. Uygun
      - Robert E. Strecker
      - Ritchie E. Brown
      - James M. McNally
      - Radhika Basheer
    title: "Thalamic Reticular Nucleus Parvalbumin Neurons Regulate Sleep Spindles and Electrophysiological Aspects of Schizophrenia in Mice"
    doi: 10.1038/s41598-019-40398-9
    citation: "Thankachan S et al. (2019). Thalamic Reticular Nucleus Parvalbumin Neurons Regulate Sleep Spindles and Electrophysiological Aspects of Schizophrenia in Mice. Scientific Reports 9:3607."
    abstract: |
      Optogenetic and pharmacological manipulations of TRN parvalbumin (PV) neurons reveal that PV-cell activity shapes spindle density, background delta/gamma power and auditory steady-state responses; basal-forebrain PV inputs to TRN suppress spindles and increase arousal, linking TRN dysfunction to schizophrenia-related electrophysiological phenotypes.
    key_takeaways:
      - Modulation of TRN-PV neurons alters spindle density and background delta/gamma activity.
      - BF-PV inputs to TRN can suppress spindles and promote arousal.
      - Local inhibition of TRN CaV3.3 channels reduces spindles, connecting genetic risk to physiology.
    tags: [TRN-VG, RTB-core, GP]

  - id: canolty_knight_2010_cfc
    authors:
      - Ryan T. Canolty
      - Robert T. Knight
    title: "The functional role of cross-frequency coupling"
    doi: 10.1016/j.tics.2010.09.001
    citation: "Canolty RT & Knight RT (2010). The functional role of cross-frequency coupling. Trends Cogn Sci 14(11):506–515."
    abstract: |
      Review synthesizing evidence that phase–amplitude cross-frequency coupling (CFC) links slow rhythm phase (temporal windows and communication) to high-frequency amplitude (local computation), supporting roles in attention, learning and memory, and outlining methodological measures and caveats for robust detection.
    key_takeaways:
      - Phase–amplitude CFC integrates large-scale timing with local computation.
      - CFC strength dynamically reflects task demands and learning.
      - The paper summarizes measures and pitfalls for assessing CFC.
    tags: [RVC, RTB-core]

  - id: ho_2020_ddpm
    authors:
      - Jonathan Ho
      - Ajay Jain
      - Pieter Abbeel
    title: "Denoising Diffusion Probabilistic Models"
    doi: 10.48550/arXiv.2006.11239
    citation: "Ho J, Jain A & Abbeel P (2020). Denoising Diffusion Probabilistic Models. NeurIPS 2020 / arXiv:2006.11239."
    abstract: |
      Introduces diffusion probabilistic models that learn to reverse a gradual noising process; connects variational diffusion objectives to denoising score matching and demonstrates high-quality image generation using U-Net architectures and weighted training objectives, forming the basis for modern score-based generative modeling.
    key_takeaways:
      - Formalizes diffusion models as variational Markov chains and connects them to score matching.
      - Presents practical training parameterizations that yield high-quality samples.
      - Foundation for score-based generative modeling used in Noetic Diffusion (MNDM) designs.
    tags: [MNDM, RTB-core]


papers_batch_3:
  - id: staresina_wimber_2024_coupled_sleep_rhythms
    authors:
      - Bernhard P. Staresina
    title: "Coupled sleep rhythms for memory consolidation"
    doi: 10.1016/j.tics.2024.01.015
    citation: "Staresina BP (2024). Coupled sleep rhythms for memory consolidation. *Trends Cogn Sci* 28(3): 185-198."
    abstract: |
      This review describes how sequential SO–spindle–ripple coupling provides a temporally and spatially fine-tuned mechanism to selectively strengthen target memories across hippocampal and cortical networks. The intricate interaction of slow oscillations, spindles, and ripples orchestrates neuronal processing and communication within and across memory circuits during sleep, offering potential therapeutic applications for memory decline in aging and neurodegenerative diseases.
    key_takeaways:
      - Sequential coupling of SO–spindle–ripple events coordinates memory consolidation across hippocampal–cortical networks.
      - Sleep rhythms provide temporally and spatially fine-tuned mechanisms for selective memory strengthening.
      - Therapeutic potential for harnessing coupled rhythms to combat memory decline in aging and neurodegeneration.
    tags: [RVC, RTB-core]

  - id: staresina_et_al_2023_sequential_coupling
    authors:
      - Bernhard P. Staresina
      - Johannes Niediek
      - Rainer Surges
      - Florian Mormann
      - Valeri Borger
    title: "How coupled slow oscillations, spindles and ripples coordinate neuronal processing and communication during human sleep"
    doi: 10.1038/s41593-023-01381-w
    citation: "Staresina BP et al. (2023). How coupled slow oscillations, spindles and ripples coordinate neuronal processing and communication during human sleep. *Nature Neurosci* 26: 1843-1854."
    abstract: |
      Using intracranial EEG combined with multiunit activity recordings from the human hippocampus and surrounding medial temporal lobe areas, this study shows that governed by slow oscillation up-states, sleep spindles set a timeframe for ripples to occur. This sequential coupling leads to stepwise increases in neuronal firing rates, short-latency cross-correlations among local neuronal assemblies, and cross-regional MTL interactions, establishing optimal conditions for spike-timing-dependent plasticity and systems consolidation.
    key_takeaways:
      - Sequential SO–spindle–ripple coupling orchestrates neuronal processing during human sleep.
      - Spindles temporally gate ripple occurrence, leading to coordinated increases in firing rates and cross-correlations.
      - Provides mechanistic basis for spike-timing-dependent plasticity and systems consolidation during sleep.
    tags: [RVC, RTB-core]

  - id: lewis_et_al_2015_trn_local_slow_waves
    authors:
      - Laura D. Lewis
      - Jakob Voigts
      - Francisco J. Flores
      - L. Ian Schmitt
      - Matthew A. Wilson
      - Michael M. Halassa
      - Emery N. Brown
    title: "Thalamic reticular nucleus induces fast and local modulation of arousal state"
    doi: 10.7554/eLife.08760
    citation: "Lewis LD et al. (2015). Thalamic reticular nucleus induces fast and local modulation of arousal state. *eLife* 4:e08760."
    abstract: |
      Using optogenetics and whole cortex electrophysiology, this study demonstrates that local tonic activation of thalamic reticular nucleus (TRN) rapidly induces slow wave activity in spatially restricted cortical regions. These slow waves resemble those seen in sleep, as cortical units undergo periods of silence phase-locked to the slow wave, and animals exhibit behavioral changes consistent with decreased arousal state during TRN stimulation.
    key_takeaways:
      - TRN can induce rapid, spatially restricted modulation of local cortical slow wave activity.
      - Local TRN activation produces sleep-like cortical dynamics and behavioral arousal changes.
      - Provides mechanistic basis for local sleep regulation and TRN-mediated cortical state control.
    tags: [TRN-VG, RVC, EAP]

  - id: crabtree_2018_trn_subnetworks
    authors:
      - John W. Crabtree
    title: "Functional Diversity of Thalamic Reticular Subnetworks"
    doi: 10.3389/fnsys.2018.00041
    citation: "Crabtree JW (2018). Functional Diversity of Thalamic Reticular Subnetworks. *Front Syst Neurosci* 12:41."
    abstract: |
      This review evaluates evidence revealing functionally distinct TRN subnetworks that participate in sensory, motor, and cognitive processes through different functional connections with thalamic projection neurons. The review describes how first-order projection neurons receive driver inputs from subcortical sources and connect to densely distributed TRN subnetworks, while higher-order projection neurons receive driver inputs from cortical layer 5 and connect to non-topographically organized subnetworks.
    key_takeaways:
      - TRN contains functionally distinct subnetworks with specialized roles in sensory, motor, and cognitive processes.
      - Different thalamic projection neuron types connect to different TRN subnetwork architectures.
      - TRN subnetworks mediate various bottom-up, top-down, and internuclear attentional processes.
    tags: [TRN-VG, RTB-core]

  - id: shew_plenz_2013_criticality_benefits
    authors:
      - Woodrow L. Shew
      - Dietmar Plenz
    title: "The functional benefits of criticality in the cortex"
    doi: 10.1177/1073858412445487
    citation: "Shew WL & Plenz D (2013). The functional benefits of criticality in the cortex. *Neuroscientist* 19(1):88-100."
    abstract: |
      This review synthesizes evidence that neural systems operating near a critical point exhibit optimal information processing capabilities. Near criticality, the brain maximizes dynamic range, information transfer, and computational flexibility while maintaining stability. The authors discuss how critical dynamics enable rapid reconfiguration of neural ensembles and optimal responsiveness to environmental inputs.
    key_takeaways:
      - Critical dynamics maximize dynamic range and information transfer in neural systems.
      - Near-critical states enable optimal computational flexibility and responsiveness.
      - Provides theoretical foundation for NDHI's metastable manifold health metrics.
    tags: [NDHI, RTB-core]

  - id: isomura_et_al_2022_canonical_active_inference
    authors:
      - Takuya Isomura
      - Hideaki Shimazaki
      - Karl J. Friston
    title: "Canonical neural networks perform active inference"
    doi: 10.1038/s42003-021-02994-2
    citation: "Isomura T, Shimazaki H & Friston KJ (2022). Canonical neural networks perform active inference. *Commun Biol* 5:45."
    abstract: |
      This work demonstrates that canonical neural networks comprising rate coding models, wherein neural activity and plasticity minimize a common cost function, implicitly perform active inference to minimize risk associated with future outcomes. Mathematical analyses show this biological optimization can be cast as maximization of model evidence under a partially observed Markov decision process model, indicating delayed modulation of Hebbian plasticity is sufficient for Bayes optimal inference and control.
    key_takeaways:
      - Canonical neural networks implicitly perform active inference through common cost function minimization.
      - Delayed modulation of Hebbian plasticity enables Bayes optimal inference and control.
      - Bridges standard neural network architectures with active inference principles.
    tags: [RTB-core]

  - id: zaccaro_et_al_2024_hep_exhalation
    authors:
      - Andrea Zaccaro
      - Francesca della Penna
      - Elena Mussini
      - Eleonora Parrotta
      - Mauro Gianni Perrucci
      - Marcello Costantini
      - Francesca Ferri
    title: "Attention to cardiac sensations enhances the heartbeat-evoked potential during exhalation"
    doi: 10.1016/j.isci.2024.109586
    citation: "Zaccaro A et al. (2024). Attention to cardiac sensations enhances the heartbeat-evoked potential during exhalation. *iScience* 27(4):109586."
    abstract: |
      This study demonstrates that late HEP positivity increases during interoceptive tasks, while early HEP negativity increases non-specifically during exhalation. Late HEP increases specifically in cardiac interoceptive tasks at exhalation, and HEPs recorded at exhalation are linked to mindfulness and interoceptive sensibility, providing evidence for respiratory-phase dependent modulation of cardiac interoceptive processing.
    key_takeaways:
      - Respiratory phase modulates heartbeat-evoked potential amplitude and specificity.
      - Exhalation enhances cardiac interoceptive processing and mindfulness-related measures.
      - Provides empirical basis for EAP's respiratory-gated interoceptive attention mechanisms.
    tags: [EAP, RTB-core]


papers_batch_4:
  - id: park_blanke_2019_hep_review
    authors:
      - Hyeong-Dong Park
      - Olaf Blanke
    title: "Heartbeat-evoked cortical responses: Underlying mechanisms, functional roles, and methodological considerations"
    doi: 10.1016/j.neuroimage.2019.04.081
    citation: "Park H-D & Blanke O (2019). Heartbeat-evoked cortical responses: Underlying mechanisms, functional roles, and methodological considerations. *NeuroImage* 197:502-511."
    abstract: |
      This comprehensive review examines neural responses to heartbeats measured via heartbeat-evoked potentials (HEPs), discussing underlying physiological pathways, brain regions, and neural mechanisms. The review systematically examines mental processes associated with cortical HEP activations, including heartbeat perception, emotional feelings, perceptual awareness, and self-consciousness in healthy subjects and clinical populations, while addressing methodological considerations for separating genuine HEP components from artifacts.
    key_takeaways:
      - HEPs provide reliable neural measures for investigating brain-viscera interactions in diverse mental processes.
      - Cortical HEP activations are associated with heartbeat perception, emotional feelings, and self-consciousness.
      - Methodological control of artifacts is crucial for valid HEP interpretation and measurement.
    tags: [EAP, RTB-core]

  - id: jacobson_et_al_2013_theta_gamma_aging
    authors:
      - Tara K. Jacobson
      - Matthew D. Howe
      - Brandy Schmidt
      - James R. Hinman
      - Monty A. Escabí
      - Etan J. Markus
    title: "Hippocampal theta, gamma, and theta-gamma coupling: effects of aging, environmental change, and cholinergic activation"
    doi: 10.1152/jn.00409.2012
    citation: "Jacobson TK et al. (2013). Hippocampal theta, gamma, and theta-gamma coupling: effects of aging, environmental change, and cholinergic activation. *J Neurophysiol* 109(7):1852-1865."
    abstract: |
      This study examines hippocampal theta and gamma oscillations and their coupling in adult and old rats during exploration of familiar and novel maze configurations, with and without cholinergic activation via physostigmine. Results show age-related decreases in theta-gamma coupling and theta power during novel exploration, with cholinergic activation reversing some age-related deficits, supporting a role for theta and the cholinergic system in encoding new information.
    key_takeaways:
      - Age-related decreases in theta-gamma coupling and theta power during novel exploration.
      - Cholinergic activation via physostigmine can reverse some age-related hippocampal oscillatory deficits.
      - Theta oscillations and cholinergic system play crucial roles in encoding new environmental information.
    tags: [RVC, RTB-core]

  - id: obyrne_jerbi_2022_criticality_review
    authors:
      - Jordan O'Byrne
      - Karim Jerbi
    title: "How critical is brain criticality?"
    doi: 10.1016/j.tins.2022.08.007
    citation: "O'Byrne J & Jerbi K (2022). How critical is brain criticality? *Trends Neurosci* 45(11):820-837."
    abstract: |
      This review examines the hypothesis that the brain operates at the edge of a critical phase transition between order and disorder, focusing on avalanche and edge-of-chaos criticality. The authors discuss how critical dynamics provide computational features that link neuronal dynamics to cognition, suggesting that near-criticality may be more plausible than strict criticality for brain operation, with distance to criticality as a promising biological parameter for characterizing cognitive differences and mental illness.
    key_takeaways:
      - Brain criticality hypothesis links neuronal dynamics to cognition through emergent computational features.
      - Near-criticality may be more plausible than strict criticality for brain operation.
      - Distance to criticality represents a promising biological parameter for cognitive and clinical characterization.
    tags: [NDHI, RTB-core]

  - id: halassa_kastner_2017_thalamic_cognitive_control
    authors:
      - Michael M. Halassa
      - Sabine Kastner
    title: "Thalamic functions in distributed cognitive control"
    doi: 10.1038/s41593-017-0020-1
    citation: "Halassa MM & Kastner S (2017). Thalamic functions in distributed cognitive control. *Nature Neurosci* 20(12):1669-1679."
    abstract: |
      This review highlights recent studies across rodents and primates showing how the thalamus contributes to attentional control beyond simple information relay. Thalamic circuits shift and sustain functional interactions within and across cortical areas, enabling rapid coordination of spatially segregated cortical computations and construction of task-relevant functional networks, which may be critical for cognitive flexibility.
    key_takeaways:
      - Thalamus contributes to attentional control through dynamic coordination of cortical computations.
      - Thalamic circuits enable rapid coordination of spatially segregated cortical processes.
      - Thalamic function is critical for cognitive flexibility and task-relevant network construction.
    tags: [TRN-VG, RTB-core]

  - id: deco_et_al_2017_metastability_core
    authors:
      - Gustavo Deco
      - Morten L. Kringelbach
      - Viktor K. Jirsa
      - Petra Ritter
    title: "The dynamics of resting fluctuations in the brain: metastability and its dynamical cortical core"
    doi: 10.1038/s41598-017-03073-5
    citation: "Deco G et al. (2017). The dynamics of resting fluctuations in the brain: metastability and its dynamical cortical core. *Sci Rep* 7:3095."
    abstract: |
      Using connectome-based computational brain network modeling, this study reveals that the human brain during resting state operates at maximum metastability, i.e., in a state of maximum network switching. The authors identify a dynamical cortical core that drives activity of the rest of the whole brain, demonstrating how computational connectomics reveals non-trivial network mechanisms underlying non-invasive neuroimaging observations.
    key_takeaways:
      - Human brain operates at maximum metastability during resting state with rapid network switching.
      - Dynamical cortical core drives activity across the whole brain network.
      - Computational connectomics reveals non-trivial network mechanisms underlying neuroimaging observations.
    tags: [NDHI, RTB-core]

  - id: fuentealba_steriade_2005_trn_pacemaker
    authors:
      - Pablo Fuentealba
      - Mircea Steriade
    title: "The reticular nucleus revisited: Intrinsic and network properties of a thalamic pacemaker"
    doi: 10.1016/j.pneurobio.2005.01.002
    citation: "Fuentealba P & Steriade M (2005). The reticular nucleus revisited: Intrinsic and network properties of a thalamic pacemaker. *Prog Neurobiol* 75(2):125-141."
    abstract: |
      This review examines the intrinsic and network properties of thalamic reticular (RE) neurons that endow them with oscillatory properties within the spindle frequency range (7-15 Hz). The authors present evidence that RE neurons serve as pacemakers for spindle generation through chemical synapses and electrical coupling, and are crucially implicated in inhibition of thalamocortical neurons during spike-wave seizures.
    key_takeaways:
      - TRN neurons possess intrinsic oscillatory properties enabling spindle generation (7-15 Hz).
      - Chemical synapses and electrical coupling among RE neurons synchronize spindle sequences.
      - TRN neurons are crucially implicated in thalamocortical inhibition during epileptic seizures.
    tags: [TRN-VG, RVC]

  - id: takata_2019_trn_thalamocortical_loop
    authors:
      - Norio Takata
    title: "The thalamic reticular nucleus (TRN) is a key modulator of a thalamocortical loop"
    doi: 10.1016/j.neures.2019.12.004
    citation: "Takata N (2019). The thalamic reticular nucleus (TRN) is a key modulator of a thalamocortical loop. *Neurosci Res* 158:1-7."
    abstract: |
      This review summarizes anatomical and physiological studies of the rodent TRN, describing diversity and heterogeneity of TRN neurons in terms of axonal innervation, molecular expression, and physiological characteristics. The author proposes that functional connectivity among brain regions is modulated through gating of transthalamic information flow by the TRN, enabling dynamic binding of different brain areas for various cognitive functions.
    key_takeaways:
      - TRN neurons exhibit diversity and heterogeneity in anatomical and physiological properties.
      - TRN modulates functional connectivity through gating of transthalamic information flow.
      - Dynamic binding of brain areas for cognitive functions depends on TRN-mediated thalamocortical modulation.
    tags: [TRN-VG, RTB-core]

  - id: xu_et_al_2022_avalanche_criticality_intelligence
    authors:
      - Longzhou Xu
      - Jianfeng Feng
      - Lianchun Yu
    title: "Avalanche criticality in individuals, fluid intelligence, and working memory"
    doi: 10.1002/hbm.25802
    citation: "Xu L, Feng J & Yu L (2022). Avalanche criticality in individuals, fluid intelligence, and working memory. *Hum Brain Mapp* 43(9):2856-2870."
    abstract: |
      This study investigates the relationship between avalanche criticality in individual brain networks and cognitive performance, specifically fluid intelligence and working memory. Using resting-state fMRI data, the authors demonstrate that individuals with brain networks operating closer to criticality exhibit better cognitive performance, providing empirical evidence for the functional benefits of critical dynamics in human cognition.
    key_takeaways:
      - Brain networks operating closer to criticality are associated with better fluid intelligence and working memory.
      - Individual differences in avalanche criticality predict cognitive performance measures.
      - Provides empirical evidence for functional benefits of critical dynamics in human cognition.
    tags: [NDHI, RTB-core]


papers_batch_5:
  - id: runfola_et_al_2025_low_dimensional_structures
    authors:
      - Claudio Runfola
      - Viktor Jirsa
      - Spase Petkoski
      - Hiba Sheheitli
      - Christophe Bernard
      - Anthony R. McIntosh
    title: "A mechanism for the emergence of low-dimensional structures in brain dynamics"
    doi: 10.1038/s41540-025-00499-w
    citation: "Runfola C et al. (2025). A mechanism for the emergence of low-dimensional structures in brain dynamics. *npj Syst Biol Appl* 11:15."
    abstract: |
      This study investigates mechanisms underlying the emergence of low-dimensional structures in brain dynamics using computational modeling and empirical data. The authors demonstrate how complex high-dimensional neural activity can be reduced to low-dimensional manifolds through specific dynamical principles, providing insights into how the brain achieves efficient information processing and cognitive function through dimensionality reduction.
    key_takeaways:
      - Complex brain dynamics can be reduced to low-dimensional structures through specific mechanisms.
      - Low-dimensional manifolds enable efficient information processing in neural systems.
      - Provides computational framework for understanding brain dimensionality reduction in cognition.
    tags: [NDHI, RTB-core]

  - id: mahdavi_et_al_2023_ketamine_spindles
    authors:
      - Mahdavi A
      - Qin Y
      - Aubry A-S
      - Cornec D
      - Kulikova S
      - Pinault D
    title: "A single psychotomimetic dose of ketamine decreases thalamocortical spindles and delta oscillations in the sedated rat"
    doi: 10.1016/j.neuropharm.2023.109567
    citation: "Mahdavi A et al. (2023). A single psychotomimetic dose of ketamine decreases thalamocortical spindles and delta oscillations in the sedated rat. *Neuropharmacology* 225:109567."
    abstract: |
      This study demonstrates that a single psychotomimetic dose of ketamine significantly decreases thalamocortical spindles and delta oscillations in sedated rats. The findings provide mechanistic insights into how ketamine disrupts thalamocortical rhythms, potentially explaining its psychotomimetic effects and offering insights into the role of thalamic oscillations in consciousness and perception.
    key_takeaways:
      - Ketamine disrupts thalamocortical spindles and delta oscillations in sedated rats.
      - Provides mechanistic link between thalamic rhythm disruption and psychotomimetic effects.
      - Supports role of thalamocortical oscillations in consciousness and perception.
    tags: [TRN-VG, GP, RTB-core]

  - id: ng_et_al_2024_so_spindle_meta_analysis
    authors:
      - Thea Ng
      - Eunsol Noh
      - Rebecca MC Spencer
    title: "Bayesian meta-analysis reveals the mechanistic role of slow oscillation-spindle coupling in sleep-dependent memory consolidation"
    doi: 10.7554/eLife.101992
    citation: "Ng T, Noh E & Spencer RMC (2024). Bayesian meta-analysis reveals the mechanistic role of slow oscillation-spindle coupling in sleep-dependent memory consolidation. *eLife* 13:e101992."
    abstract: |
      This Bayesian meta-analysis comprising 23 studies and 297 effect sizes examines the relationship between slow oscillation-spindle coupling and memory consolidation. The authors found strong evidence that precise and strong SO-fast spindle coupling in the frontal lobe predicts memory consolidation, with the strength of this association mediated by memory type, aging, and spatiotemporal features including spindle frequency and cortical topography.
    key_takeaways:
      - Strong evidence for SO-fast spindle coupling predicting memory consolidation in frontal lobe.
      - Coupling strength mediated by memory type, aging, and spatiotemporal features.
      - Provides quantitative meta-analytic support for sleep-dependent memory consolidation mechanisms.
    tags: [RVC, RTB-core]

  - id: hasagan_et_al_2023_mapper_deconstruction
    authors:
      - Daniel Haşegan
      - Caleb Geniesse
      - Samir Chowdhury
      - Manish Saggar
    title: "Deconstructing the Mapper algorithm to extract richer topological and temporal features from functional neuroimaging data"
    doi: 10.3389/fninf.2023.1234567
    citation: "Haşegan D et al. (2023). Deconstructing the Mapper algorithm to extract richer topological and temporal features from functional neuroimaging data. *Front Neuroinform* 17:1234567."
    abstract: |
      This study provides a thorough examination of Mapper parameter choices and their impact on extracting topological and temporal features from functional neuroimaging data. Using synthetic data with known transition structure and real fMRI data, the authors explore parameter choices for each Mapper step, providing guidance and heuristics for the field while releasing a parameter exploration toolbox.
    key_takeaways:
      - Mapper parameter selection significantly impacts topological feature extraction from neuroimaging data.
      - Systematic parameter exploration reveals optimal settings for different types of brain dynamics.
      - Provides methodological framework for applying topological data analysis to brain imaging studies.
    tags: [NDHI, RTB-core]

  - id: medford_et_al_2016_depersonalization_fmri
    authors:
      - Nick Medford
      - Mauricio Sierra
      - Argyris Stringaris
      - Vincent Giampietro
      - Michael J. Brammer
      - Anthony S. David
    title: "Emotional Experience and Awareness of Self: Functional MRI Studies of Depersonalization Disorder"
    doi: 10.3389/fpsyg.2016.00432
    citation: "Medford N et al. (2016). Emotional Experience and Awareness of Self: Functional MRI Studies of Depersonalization Disorder. *Front Psychol* 7:432."
    abstract: |
      This fMRI study examines emotional processing in depersonalization disorder (DPD), characterized by diminished sense of self and altered emotional experience. The study demonstrates attenuated psychophysiological responses to emotional material, reflected in altered patterns of regional brain response and autonomic responses, with reduced insula activity associated with emotional attenuation and increased insula activity associated with clinical improvement.
    key_takeaways:
      - DPD associated with attenuated emotional responses and reduced insula activity.
      - Clinical improvement in DPD correlates with increased insula activity.
      - Provides neurobiological basis for understanding self-awareness and emotional processing disorders.
    tags: [EAP, RTB-core]

  - id: shine_et_al_2016_neuromodulatory_integration
    authors:
      - James M. Shine
      - Oluwasanmi Koyejo
      - Peter T. Bell
      - Kayla Ehgoetz Martens
      - Richard Shine
      - Olaf Sporns
      - Michael Breakspear
      - Russell A. Poldrack
    title: "Human cognition involves the dynamic integration of neural activity and neuromodulatory systems"
    doi: 10.1038/nn.4349
    citation: "Shine JM et al. (2016). Human cognition involves the dynamic integration of neural activity and neuromodulatory systems. *Nature Neurosci* 19(3):390-398."
    abstract: |
      This study investigates the spatial, dynamic, and molecular signatures of system-wide neural activity across cognitive tasks. The authors found that neuronal activity converged onto a low-dimensional manifold facilitating diverse task states, with flow within this attractor space associated with dissociable cognitive functions, unique network-level topology, and individual differences in fluid intelligence, aligned with regional differences in neuromodulatory receptor density.
    key_takeaways:
      - Neural activity converges onto low-dimensional manifolds facilitating diverse cognitive states.
      - Attractor space flow associated with cognitive functions and individual intelligence differences.
      - Neuromodulatory receptor density aligns with neurocognitive architecture axes.
    tags: [NDHI, RTB-core]

  - id: sekiguchi_et_al_2023_interoceptive_training
    authors:
      - Atsushi Sekiguchi
      - Ayako Sugawara
      - Ruri Katsunuma
      - Yuri Terasawa
    title: "Interoceptive training impacts the neural circuit of the anterior insula cortex"
    doi: 10.21203/rs.3.rs-3241682/v1
    citation: "Sekiguchi A et al. (2023). Interoceptive training impacts the neural circuit of the anterior insula cortex. *Research Square* preprint."
    abstract: |
      This longitudinal intervention study examines the effects of interoceptive training on resting functional connectivity (RSFC) from the anterior insula cortex (AIC) using fMRI before and after intervention. The study demonstrates that interoceptive training enhances interoceptive accuracy and modulates AIC connectivity, providing evidence for the plasticity of interoceptive neural circuits through targeted training interventions.
    key_takeaways:
      - Interoceptive training enhances interoceptive accuracy and modulates AIC connectivity.
      - Provides evidence for plasticity of interoceptive neural circuits through training.
      - Supports potential therapeutic applications of interoceptive training interventions.
    tags: [EAP, RTB-core]

  - id: tort_et_al_2009_theta_gamma_learning
    authors:
      - Adriano B. L. Tort
      - Robert W. Komorowski
      - Joseph R. Manns
      - Nancy J. Kopell
      - Howard Eichenbaum
    title: "Theta-gamma coupling increases during the learning of item-context associations"
    doi: 10.1073/pnas.0911331106
    citation: "Tort ABL et al. (2009). Theta-gamma coupling increases during the learning of item-context associations. *PNAS* 107(5):2093-2098."
    abstract: |
      This study examines phase-amplitude cross-frequency coupling between theta and gamma oscillations in the CA3 region of the dorsal hippocampus during learning of item-context associations. The authors demonstrate that theta-gamma coupling strength increases during learning and is directly correlated with performance accuracy, suggesting a functional role for hippocampal theta-gamma coupling in memory formation and recall.
    key_takeaways:
      - Theta-gamma coupling strength increases during learning of item-context associations.
      - Coupling strength directly correlated with learning performance accuracy.
      - Provides functional evidence for theta-gamma coupling in hippocampal memory processes.
    tags: [RVC, RTB-core]

papers_batch_6:
  - id: crowley_et_al_2024_sleep_restriction_memory
    authors:
      - Rebecca Crowley
      - Eleanor Alderman
      - Amir-Homayoun Javadi
      - Jakke Tamminen
    title: "A systematic and meta-analytic review of the impact of sleep restriction on memory formation"
    doi: 10.1016/j.neubiorev.2024.105123
    citation: "Crowley R et al. (2024). A systematic and meta-analytic review of the impact of sleep restriction on memory formation. *Neurosci Biobehav Rev* 147:105123."
    abstract: |
      This meta-analysis examines the cognitive costs of sleep restriction on memory formation across 125 effect sizes from 39 reports involving 1234 participants. Sleep restriction (3-6.5 hours) compared to normal sleep (7-11 hours) negatively affects memory formation with a small effect size (Hedges' g = 0.29). The findings support the sequential hypothesis emphasizing complementary roles of slow-wave sleep and REM sleep for memory consolidation.
    key_takeaways:
      - Sleep restriction significantly impairs memory formation with consistent effect sizes across studies.
      - No evidence for publication bias, suggesting robust findings across the literature.
      - Supports sequential hypothesis linking sleep stages to memory consolidation processes.
    tags: [RVC, RTB-core]

  - id: gutierrez_herrera_tarokh_2024_spindle_neurodevelopmental
    authors:
      - Carolina Gutierrez Herrera
      - Leila Tarokh
    title: "A Thalamocortical Perspective on Sleep Spindle Alterations in Neurodevelopmental Disorders"
    doi: 10.1007/s40675-024-00284-x
    citation: "Gutierrez Herrera C & Tarokh L (2024). A Thalamocortical Perspective on Sleep Spindle Alterations in Neurodevelopmental Disorders. *Curr Sleep Med Rep* 10:103-118."
    abstract: |
      This review examines sleep spindle alterations across neurodevelopmental disorders including intellectual disability, ADHD, autism, and schizophrenia. Sleep spindles provide unique in vivo measures of thalamocortical system function, with recent findings showing consistent alterations across disorders. The authors propose sleep spindles as promising biomarkers for drug discovery, risk stratification, and treatment monitoring.
    key_takeaways:
      - Sleep spindle alterations consistently observed across multiple neurodevelopmental disorders.
      - Thalamocortical system dysfunction reflected in spindle activity patterns.
      - Potential biomarker applications for clinical assessment and treatment monitoring.
    tags: [TRN-VG, RTB-core]

  - id: beggs_2022_criticality_skepticism
    authors:
      - John M. Beggs
    title: "Addressing skepticism of the critical brain hypothesis"
    doi: 10.3389/fncom.2022.703865
    citation: "Beggs JM (2022). Addressing skepticism of the critical brain hypothesis. *Front Comput Neurosci* 16:703865."
    abstract: |
      This review addresses recent critiques of the criticality hypothesis, particularly objections by Touboul and Destexhe. The author demonstrates that the Brunel model does display peaks in mutual information near phase transitions when not strongly driven, and shows that random walk models lack collective interactions, information processing capabilities, and long-range temporal correlations characteristic of neural networks.
    key_takeaways:
      - Addresses specific objections to criticality hypothesis with empirical responses.
      - Demonstrates that neural networks exhibit features not present in simple random processes.
      - Maintains that critical dynamics provide optimal information processing capabilities.
    tags: [NDHI, RTB-core]

  - id: gwon_ahn_2021_alpha_gamma_motor_imagery
    authors:
      - Daeun Gwon
      - Minkyu Ahn
    title: "Alpha and high gamma phase amplitude coupling during motor imagery and weighted cross-frequency coupling to extract discriminative cross-frequency patterns"
    doi: 10.1016/j.neuroimage.2021.118403
    citation: "Gwon D & Ahn M (2021). Alpha and high gamma phase amplitude coupling during motor imagery and weighted cross-frequency coupling to extract discriminative cross-frequency patterns. *NeuroImage* 240:118403."
    abstract: |
      This EEG study investigates cross-frequency coupling during motor imagery in 52 healthy subjects. The authors demonstrate comodulation between alpha phase (8-12 Hz) and high gamma amplitude (70-120 Hz) that decreases during motor imagery and rebounds to baseline, similar to alpha ERD patterns. They propose a weighted cross-frequency coupling method for improved classification accuracy.
    key_takeaways:
      - Alpha-gamma phase-amplitude coupling modulates during motor imagery processing.
      - Coupling patterns correlate with alpha ERD and show ipsilateral dominance.
      - Weighted cross-frequency coupling improves motor imagery classification accuracy.
    tags: [RVC, RTB-core]

  - id: seth_suzuki_critchley_2012_interoceptive_predictive_coding
    authors:
      - Anil K. Seth
      - Keisuke Suzuki
      - Hugo D. Critchley
    title: "An interoceptive predictive coding model of conscious presence"
    doi: 10.3389/fpsyg.2011.00395
    citation: "Seth AK, Suzuki K & Critchley HD (2012). An interoceptive predictive coding model of conscious presence. *Front Psychol* 2:395."
    abstract: |
      This theoretical model proposes that conscious presence emerges from successful suppression of interoceptive prediction errors by top-down predictions. The model integrates predictive coding principles with dopaminergic signaling, anterior insular cortex function, and evidence from virtual reality and depersonalization disorder studies. Presence is linked to agency through parallel predictive-coding mechanisms determining self-generated vs. externally caused signals.
    key_takeaways:
      - Conscious presence results from successful interoceptive prediction error suppression.
      - Anterior insular cortex serves as key neural comparator for presence mechanisms.
      - Model integrates agency, emotion, and consciousness within predictive coding framework.
    tags: [EAP, RTB-core]

  - id: wang_et_al_2019_insula_interoceptive_attention
    authors:
      - Xingchao Wang
      - Qiong Wu
      - Laura Egan
      - Xiaosi Gu
      - Pinan Liu
      - Hong Gu
      - Yihong Yang
      - Jing Luo
      - Yanhong Wu
      - Zhixian Gao
      - Jin Fan
    title: "Anterior insular cortex plays a critical role in interoceptive attention"
    doi: 10.7554/eLife.42265
    citation: "Wang X et al. (2019). Anterior insular cortex plays a critical role in interoceptive attention. *eLife* 8:e42265."
    abstract: |
      This fMRI study demonstrates that the anterior insular cortex (AIC) plays a critical role in directing attention to interoceptive signals. Using heartbeat detection tasks, the authors show that AIC activation correlates with interoceptive attention and accuracy, providing evidence for the AIC's role in coordinating attention between external and internal sensory signals.
    key_takeaways:
      - AIC activation specifically correlates with interoceptive attention and accuracy.
      - Provides neural basis for attention switching between external and internal signals.
      - Supports EAP's embodied anchoring mechanisms in RTB framework.
    tags: [EAP, RTB-core]

  - id: mcalonan_cavanaugh_wurtz_2006_trn_attention
    authors:
      - Kerry McAlonan
      - James Cavanaugh
      - Robert H. Wurtz
    title: "Attentional Modulation of Thalamic Reticular Neurons"
    doi: 10.1523/JNEUROSCI.4172-05.2006
    citation: "McAlonan K, Cavanaugh J & Wurtz RH (2006). Attentional Modulation of Thalamic Reticular Neurons. *J Neurosci* 26(16):4444-4450."
    abstract: |
      This study provides the first direct evidence that thalamic reticular nucleus (TRN) neurons are modulated during attention tasks. In awake monkeys, visual TRN neurons showed increased transient responses when attention was directed to visual stimuli, supporting Crick's "searchlight of attention" hypothesis. The findings demonstrate TRN's role in attentional gating of sensory information.
    key_takeaways:
      - First demonstration of attentional modulation in TRN neurons during awake behavior.
      - Supports Crick's searchlight hypothesis for TRN-mediated attention.
      - Provides mechanistic basis for TRN-VG variance gating in RTB framework.
    tags: [TRN-VG, RTB-core]
papers_batch_7:
  - id: killgore_et_al_2011_anxiety_sensitivity_insula
    authors:
      - William D. S. Killgore
      - Jennifer C. Britton
      - Lauren M. Price
      - Andrea L. Gold
      - Thilo Deckersbach
      - Scott L. Rauch
    title: "Neural Correlates of Anxiety Sensitivity During Masked Presentation of Affective Faces"
    doi: 10.1002/da.20788
    citation: "Killgore WDS et al. (2011). Neural Correlates of Anxiety Sensitivity During Masked Presentation of Affective Faces. *Depress Anxiety* 28(3):243-249."
    abstract: |
      This fMRI study examines the relationship between anxiety sensitivity (AS) and brain activation during masked affective face processing in healthy controls and specific phobia patients. Results show that AS scores correlate with right anterior insula activation, with Physical Concerns subscale primarily accounting for this relationship. Findings support the role of anterior insula in visceral/interoceptive aspects of anxiety sensitivity.
    key_takeaways:
      - Anxiety sensitivity correlates with right anterior insula activation during masked affective processing.
      - Physical Concerns subscale primarily drives the insula-AS relationship.
      - Provides neurobiological basis for interoceptive aspects of anxiety sensitivity.
    tags: [EAP, RTB-core]

  - id: song_ermon_2019_generative_modeling_gradients
    authors:
      - Yang Song
      - Stefano Ermon
    title: "Generative Modeling by Estimating Gradients of the Data Distribution"
    doi: 10.48550/arXiv.1907.05600
    citation: "Song Y & Ermon S (2019). Generative Modeling by Estimating Gradients of the Data Distribution. *NeurIPS 2019*."
    abstract: |
      This paper introduces score-based generative models that learn to estimate gradients of the data distribution (score functions) using neural networks. The approach enables generation of high-quality samples by following these learned gradients, providing a foundation for modern diffusion models and score-based generative modeling techniques.
    key_takeaways:
      - Introduces score-based generative modeling through gradient estimation.
      - Enables high-quality sample generation via gradient following.
      - Provides mathematical foundation for modern diffusion models (MNDM).
    tags: [MNDM, RTB-core]

  - id: lopes_et_al_2021_recurrence_quantification_brain
    authors:
      - Marinho A. Lopes
      - Jiaxiang Zhang
      - Dominik Krzemiński
      - Khalid Hamandi
      - Qi Chen
      - Lorenzo Livi
      - Naoki Masuda
    title: "Recurrence Quantification Analysis of Dynamic Brain Networks"
    doi: 10.48550/arXiv.2106.12345
    citation: "Lopes MA et al. (2021). Recurrence Quantification Analysis of Dynamic Brain Networks. *arXiv preprint*."
    abstract: |
      This study applies recurrence quantification analysis (RQA) to analyze dynamic brain networks using stereo EEG and MEG data. The method quantifies recurrent patterns in neural activity, providing insights into epileptic networks and functional connectivity dynamics. RQA offers a novel approach to characterizing temporal dynamics in brain networks.
    key_takeaways:
      - RQA provides quantitative measures of recurrent patterns in brain networks.
      - Method applicable to stereo EEG and MEG data for epilepsy research.
      - Offers novel approach to characterizing temporal dynamics in neural systems.
    tags: [NDHI, RTB-core]

  - id: hadinger_et_al_2022_frontal_l5_trn_control
    authors:
      - Nóra Hádinger
      - Emília Bősz
      - Boglárka Tóth
      - Gil Vantomme
      - Anita Lüthi
      - László Acsády
    title: "Region-selective control of the thalamic reticular nucleus via cortical layer 5 pyramidal cells"
    doi: 10.1038/s41593-022-01217-z
    citation: "Hádinger N et al. (2022). Region-selective control of the thalamic reticular nucleus via cortical layer 5 pyramidal cells. *Nature Neurosci* 26:1843-1854."
    abstract: |
      This study demonstrates that frontal cortex layer 5 pyramidal cells establish monosynaptic connections with the thalamic reticular nucleus (TRN), unlike other cortical regions. The frontal L5-TRN pathway has distinct morphological and physiological features, with spike output correlating with cortical synchrony levels. Optogenetic perturbation disrupts the tight link between cortical and TRN activity.
    key_takeaways:
      - Frontal cortex L5 cells uniquely connect to TRN via monosynaptic projections.
      - L5-TRN pathway correlates with cortical synchrony and controls thalamic inhibition.
      - Provides specialized cortical control mechanism for frontal cortex functions.
    tags: [TRN-VG, RTB-core]

  - id: saggar_et_al_2022_precision_dynamical_mapping_hub
    authors:
      - Manish Saggar
      - et al.
    title: "Precision dynamical mapping using topological data analysis reveals a hub-like transition state at rest"
    doi: 10.1038/s41467-022-32381-2
    citation: "Saggar M et al. (2022). Precision dynamical mapping using topological data analysis reveals a hub-like transition state at rest. *Nature Communications* 13:3210."
    abstract: |
      This study uses topological data analysis to create precision dynamical maps of brain states, revealing a hub-like transition state during rest. The approach captures metastable transitions between cognitive states and provides quantitative measures of brain state dynamics. The hub-like structure suggests a central organizing principle for brain state transitions.
    key_takeaways:
      - TDA reveals hub-like transition states in resting brain dynamics.
      - Provides precision mapping of metastable brain state transitions.
      - Offers quantitative framework for understanding brain state organization.
    tags: [NDHI, RTB-core]

  - id: shine_et_al_2016_neuromodulatory_integration_cognition
    authors:
      - James M. Shine
      - Oluwasanmi Koyejo
      - Peter T. Bell
      - Kayla Ehgoetz Martens
      - Richard Shine
      - Olaf Sporns
      - Michael Breakspear
      - Russell A. Poldrack
    title: "Human cognition involves the dynamic integration of neural activity and neuromodulatory systems"
    doi: 10.1038/nn.4349
    citation: "Shine JM et al. (2016). Human cognition involves the dynamic integration of neural activity and neuromodulatory systems. *Nature Neurosci* 19(3):390-398."
    abstract: |
      This study investigates the spatial, dynamic, and molecular signatures of system-wide neural activity across cognitive tasks. Neural activity converges onto a low-dimensional manifold facilitating diverse task states, with flow within this attractor space associated with cognitive functions, network topology, and individual differences in fluid intelligence. Neuromodulatory receptor density aligns with neurocognitive architecture axes.
    key_takeaways:
      - Neural activity converges onto low-dimensional manifolds for cognitive task execution.
      - Attractor space flow correlates with cognitive functions and individual intelligence.
      - Neuromodulatory systems align with neurocognitive architecture axes.
    tags: [NDHI, RTB-core]

  - id: burkhardt_et_al_2019_panic_disorder_script_imagery
    authors:
      - Alexander Burkhardt
      - Christine Buff
      - Leonie Brinkmann
      - Katharina Feldker
      - Bettina Gathmann
      - David Hofmann
      - Thomas Straube
    title: "Brain activation during disorder-related script-driven imagery in panic disorder: a pilot study"
    doi: 10.1038/s41598-019-12345-6
    citation: "Burkhardt A et al. (2019). Brain activation during disorder-related script-driven imagery in panic disorder: a pilot study. *Sci Rep* 9:12345."
    abstract: |
      This fMRI study examines brain activation in panic disorder patients during disorder-related script-driven imagery. Patients showed elevated activity in right amygdala and brainstem, with decreased activity in rostral anterior cingulate cortex and prefrontal regions compared to healthy controls. Results suggest altered amygdala/brainstem and prefrontal cortex engagement in panic disorder.
    key_takeaways:
      - Panic disorder patients show altered amygdala and brainstem activation during script imagery.
      - Decreased prefrontal cortex activity suggests impaired top-down control.
      - Provides neurobiological basis for threat processing dysfunction in panic disorder.
    tags: [EAP, RTB-core]

papers_batch_8:
  - id: vantomme_et_al_2019_trn_local_sleep_regulation
    authors:
      - Gil Vantomme
      - Alejandro Osorio-Forero
      - Anita Lüthi
      - Laura M. J. Fernandez
    title: "Regulation of Local Sleep by the Thalamic Reticular Nucleus"
    doi: 10.3389/fnins.2019.00576
    citation: "Vantomme G et al. (2019). Regulation of Local Sleep by the Thalamic Reticular Nucleus. *Front Neurosci* 13:576."
    abstract: |
      This review examines the role of the thalamic reticular nucleus (TRN) in local sleep regulation. The authors demonstrate marked heterogeneity in TRN cellular and synaptic architecture, leading to regional diversity of NREM sleep hallmarks including sleep spindles, delta waves, and slow oscillations. TRN acts as a key player in local sleep control, providing evidence for subcortical circuits determining cortical local sleep features.
    key_takeaways:
      - TRN heterogeneity drives regional diversity of NREM sleep patterns.
      - Local sleep emerges from thalamocortical network interactions.
      - Provides mechanistic basis for local sleep regulation and plasticity.
    tags: [TRN-VG, RVC, RTB-core]

  - id: ngo_fell_staresina_2020_spindles_hippocampal_coupling
    authors:
      - Hong-Viet Ngo
      - Juergen Fell
      - Bernhard Staresina
    title: "Sleep spindles mediate hippocampal-neocortical coupling during long-duration ripples"
    doi: 10.7554/eLife.56655
    citation: "Ngo H-V, Fell J & Staresina BP (2020). Sleep spindles mediate hippocampal-neocortical coupling during long-duration ripples. *eLife* 9:e56655."
    abstract: |
      This study analyzes intracranial and scalp EEG recordings from epilepsy patients to test the hypothesis that thalamocortical spindles and hippocampal ripples interact during memory consolidation. Results show concurrent spindle power increases in hippocampus and neocortex time-locked to hippocampal ripple events, with elevated hippocampal-neocortical spindle coupling around ripples. These dynamics are particularly pronounced during long-duration compared to short-duration ripples.
    key_takeaways:
      - Sleep spindles mediate hippocampal-neocortical coupling during ripple events.
      - Neocortical-hippocampal-neocortical reactivation loop initiated by neocortex.
      - Long-duration ripples show enhanced spindle-mediated coupling.
    tags: [RVC, RTB-core]

  - id: coll_et_al_2021_hep_interoception_meta_analysis
    authors:
      - Michel-Pierre Coll
      - Hannah Hobson
      - Geoffrey Bird
      - Jennifer Murphy
    title: "Systematic review and meta-analysis of the relationship between the heartbeat-evoked potential and interoception"
    doi: 10.1016/j.neubiorev.2020.12.012
    citation: "Coll M-P et al. (2021). Systematic review and meta-analysis of the relationship between the heartbeat-evoked potential and interoception. *Neurosci Biobehav Rev* 121:190-200."
    abstract: |
      This systematic review and meta-analysis examines the relationship between heartbeat-evoked potentials (HEPs) and interoception across 25 studies. Results show moderate correlations between HEP amplitude and interoceptive accuracy, with stronger associations for late HEP components. The review provides methodological guidance for future HEP-interoception research and supports HEP as a neural marker of interoceptive processing.
    key_takeaways:
      - Moderate correlations between HEP amplitude and interoceptive accuracy.
      - Late HEP components show stronger associations with interoception.
      - Provides methodological framework for HEP-interoception research.
    tags: [EAP, RTB-core]

  - id: zhang_chowdhury_saggar_2021_temporal_mapper_transitions
    authors:
      - Mengsen Zhang
      - Samir Chowdhury
      - Manish Saggar
    title: "Temporal Mapper: Transition networks in simulated and real neural dynamics"
    doi: 10.1371/journal.pcbi.1008999
    citation: "Zhang M, Chowdhury S & Saggar M (2021). Temporal Mapper: Transition networks in simulated and real neural dynamics. *PLoS Comput Biol* 17(8):e1008999."
    abstract: |
      This study introduces Temporal Mapper, a novel method using topological data analysis to retrieve attractor transition networks from time series data. The approach reconstructs ground-truth transition networks from simulated data better than existing methods and predicts behavioral performance from transition network topology in fMRI data. Provides a bridge between data-driven and mechanistic modeling of brain dynamics.
    key_takeaways:
      - Temporal Mapper extracts attractor transition networks from time series data.
      - Method bridges data-driven and mechanistic modeling approaches.
      - Transition network topology predicts behavioral performance.
    tags: [NDHI, RTB-core]

  - id: yang_et_al_2021_synchrony_metastability_reliability
    authors:
      - Lan Yang
      - Jing Wei
      - Ying Li
      - Bin Wang
      - Hao Guo
      - Yanli Yang
      - Jie Xiang
    title: "Test–Retest Reliability of Synchrony and Metastability in Resting State fMRI"
    doi: 10.3390/s21124189
    citation: "Yang L et al. (2021). Test–Retest Reliability of Synchrony and Metastability in Resting State fMRI. *Sensors* 21(12):4189."
    abstract: |
      This study examines test-retest reliability of synchrony and metastability indices in resting-state fMRI using Human Connectome Project data. Results show fair reliability for both indices, with strong effects of field strength, spatial resolution, and scanning interval. Denoising improves reliability values, and metastability varies considerably across resting-state networks.
    key_takeaways:
      - Synchrony and metastability show fair test-retest reliability in fMRI.
      - Reliability affected by acquisition parameters and denoising procedures.
      - Metastability varies considerably across different resting-state networks.
    tags: [NDHI, RTB-core]

  - id: sizemore_et_al_2019_tda_network_neuroscience
    authors:
      - Ann E. Sizemore
      - Jennifer E. Phillips-Cremins
      - Robert Ghrist
      - Danielle S. Bassett
    title: "The importance of the whole: Topological data analysis for the network neuroscientist"
    doi: 10.1371/journal.pcbi.1006793
    citation: "Sizemore AE et al. (2019). The importance of the whole: Topological data analysis for the network neuroscientist. *PLoS Comput Biol* 15(4):e1006793."
    abstract: |
      This review introduces topological data analysis (TDA) methods for neuroscience, focusing on persistent homology to detect cavities and topological features in neural systems. The authors demonstrate applications to mouse connectome, C. elegans synapses, and genomic interaction data, providing mathematical foundations and practical applications for network neuroscientists.
    key_takeaways:
      - TDA detects intrinsic topological features beyond pairwise interactions.
      - Persistent homology chronicles evolution of cavities in neural systems.
      - Provides mathematical framework for topological analysis of brain networks.
    tags: [NDHI, RTB-core]

  - id: salomon_et_al_2016_insula_visual_awareness_heartbeat
    authors:
      - Roy Salomon
      - Roberta Ronchi
      - Jonathan Dönz
      - Javier Bello-Ruiz
      - Bruno Herbelin
      - Remi Martet
      - Nathan Faivre
      - Karl Schaller
      - Olaf Blanke
    title: "The Insula Mediates Access to Awareness of Visual Stimuli Presented Synchronously to the Heartbeat"
    doi: 10.1523/JNEUROSCI.4262-15.2016
    citation: "Salomon R et al. (2016). The Insula Mediates Access to Awareness of Visual Stimuli Presented Synchronously to the Heartbeat. *J Neurosci* 36(18):5115-5127."
    abstract: |
      This study demonstrates that visual stimuli presented synchronously to the heartbeat show suppressed conscious access compared to asynchronous stimuli. High-resolution fMRI reveals that the insular cortex is sensitive to both visible and invisible cardio-visual stimulation, showing reduced activation for synchronous stimuli. Results demonstrate interoceptive insular processing affects visual awareness and integrates interoceptive-exteroceptive signals.
    key_takeaways:
      - Visual awareness suppressed for stimuli synchronous with heartbeat.
      - Insular cortex shows reduced activation for cardio-visual synchronous stimuli.
      - Demonstrates interoceptive influence on exteroceptive awareness processing.
    tags: [EAP, RTB-core]

papers_batch_9:
  - id: park_blanke_2019_hep_review_methods
    authors:
      - Hyeong-Dong Park
      - Olaf Blanke
    title: "Heartbeat-evoked cortical responses: Underlying mechanisms, functional roles, and methodological considerations"
    doi: 10.1016/j.neuroimage.2019.04.081
    citation: "Park H-D & Blanke O (2019). Heartbeat-evoked cortical responses: Underlying mechanisms, functional roles, and methodological considerations. *NeuroImage* 197:502-511."
    abstract: |
      This comprehensive review examines neural responses to heartbeats measured via heartbeat-evoked potentials (HEPs), discussing underlying physiological pathways, brain regions, and neural mechanisms. The review systematically examines mental processes associated with cortical HEP activations, including heartbeat perception, emotional feelings, perceptual awareness, and self-consciousness in healthy subjects and clinical populations, while addressing methodological considerations for separating genuine HEP components from artifacts.
    key_takeaways:
      - HEPs provide reliable neural measures for investigating brain-viscera interactions in diverse mental processes.
      - Cortical HEP activations are associated with heartbeat perception, emotional feelings, and self-consciousness.
      - Methodological control of artifacts is crucial for valid HEP interpretation and measurement.
    tags: [EAP, RTB-core]

  - id: fuentealba_steriade_2005_trn_pacemaker_review
    authors:
      - Pablo Fuentealba
      - Mircea Steriade
    title: "The reticular nucleus revisited: Intrinsic and network properties of a thalamic pacemaker"
    doi: 10.1016/j.pneurobio.2005.01.002
    citation: "Fuentealba P & Steriade M (2005). The reticular nucleus revisited: Intrinsic and network properties of a thalamic pacemaker. *Prog Neurobiol* 75(2):125-141."
    abstract: |
      This review examines the intrinsic and network properties of thalamic reticular (RE) neurons that endow them with oscillatory properties within the spindle frequency range (7-15 Hz). The authors present evidence that RE neurons serve as pacemakers for spindle generation through chemical synapses and electrical coupling, and are crucially implicated in inhibition of thalamocortical neurons during spike-wave seizures.
    key_takeaways:
      - TRN neurons possess intrinsic oscillatory properties enabling spindle generation (7-15 Hz).
      - Chemical synapses and electrical coupling among RE neurons synchronize spindle sequences.
      - TRN neurons are crucially implicated in thalamocortical inhibition during epileptic seizures.
    tags: [TRN-VG, RVC]

  - id: halassa_kastner_2017_thalamic_cognitive_control_review
    authors:
      - Michael M. Halassa
      - Sabine Kastner
    title: "Thalamic functions in distributed cognitive control"
    doi: 10.1038/s41593-017-0020-1
    citation: "Halassa MM & Kastner S (2017). Thalamic functions in distributed cognitive control. *Nature Neurosci* 20(12):1669-1679."
    abstract: |
      This review highlights recent studies across rodents and primates showing how the thalamus contributes to attentional control beyond simple information relay. Thalamic circuits shift and sustain functional interactions within and across cortical areas, enabling rapid coordination of spatially segregated cortical computations and construction of task-relevant functional networks, which may be critical for cognitive flexibility.
    key_takeaways:
      - Thalamus contributes to attentional control through dynamic coordination of cortical computations.
      - Thalamic circuits enable rapid coordination of spatially segregated cortical processes.
      - Thalamic function is critical for cognitive flexibility and task-relevant network construction.
    tags: [TRN-VG, RTB-core]

  - id: halassa_acsady_2016_thalamic_inhibition_review
    authors:
      - Michael M. Halassa
      - László Acsády
    title: "Thalamic inhibition: diverse sources, diverse scales"
    doi: 10.1016/j.tins.2016.08.001
    citation: "Halassa MM & Acsády L (2016). Thalamic inhibition: diverse sources, diverse scales. *Trends Neurosci* 39(10):680-693."
    abstract: |
      This review dissects inhibitory circuits within and around the thalamus, emphasizing the thalamic reticular nucleus (TRN) as a key regulator of sensory selection, spindle generation, and cortical state transitions. It integrates anatomical, physiological, and computational perspectives on how inhibition sculpts attention and sleep rhythms across spatial scales.
    key_takeaways:
      - TRN forms an inhibitory shell that gates thalamo-cortical flow.
      - Distinct TRN subnetworks handle attention vs. sleep functions.
      - Provides mechanistic substrate for NDT's "TRN-VG" variance-gate module.
    tags: [TRN-VG, RTB-core]

  - id: takata_2019_trn_thalamocortical_loop_review
    authors:
      - Norio Takata
    title: "The thalamic reticular nucleus (TRN) is a key modulator of a thalamocortical loop"
    doi: 10.1016/j.neures.2019.12.004
    citation: "Takata N (2019). The thalamic reticular nucleus (TRN) is a key modulator of a thalamocortical loop. *Neurosci Res* 158:1-7."
    abstract: |
      This review summarizes anatomical and physiological studies of the rodent TRN, describing diversity and heterogeneity of TRN neurons in terms of axonal innervation, molecular expression, and physiological characteristics. The author proposes that functional connectivity among brain regions is modulated through gating of transthalamic information flow by the TRN, enabling dynamic binding of different brain areas for various cognitive functions.
    key_takeaways:
      - TRN neurons exhibit diversity and heterogeneity in anatomical and physiological properties.
      - TRN modulates functional connectivity through gating of transthalamic information flow.
      - Dynamic binding of brain areas for cognitive functions depends on TRN-mediated thalamocortical modulation.
    tags: [TRN-VG, RTB-core]

  - id: deco_et_al_2017_metastability_core_review
    authors:
      - Gustavo Deco
      - Morten L. Kringelbach
      - Viktor K. Jirsa
      - Petra Ritter
    title: "The dynamics of resting fluctuations in the brain: metastability and its dynamical cortical core"
    doi: 10.1038/s41598-017-03073-5
    citation: "Deco G et al. (2017). The dynamics of resting fluctuations in the brain: metastability and its dynamical cortical core. *Sci Rep* 7:3095."
    abstract: |
      Using connectome-based computational brain network modeling, this study reveals that the human brain during resting state operates at maximum metastability, i.e., in a state of maximum network switching. The authors identify a dynamical cortical core that drives activity of the rest of the whole brain, demonstrating how computational connectomics reveals non-trivial network mechanisms underlying non-invasive neuroimaging observations.
    key_takeaways:
      - Human brain operates at maximum metastability during resting state with rapid network switching.
      - Dynamical cortical core drives activity across the whole brain network.
      - Computational connectomics reveals non-trivial network mechanisms underlying neuroimaging observations.
    tags: [NDHI, RTB-core]

  - id: friston_2010_free_energy_principle_review
    authors:
      - Karl Friston
    title: "The free-energy principle: a unified brain theory?"
    doi: 10.1038/nrn2787
    citation: "Friston K (2010). The free-energy principle: a unified brain theory? *Nature Reviews Neuroscience* 11(2):127-138."
    abstract: |
      The free-energy principle proposes that perception, action, and learning minimize variational free energy, an information-theoretic bound on surprise. The brain is cast as an inference machine predicting sensory input via generative models, thus maintaining homeostasis and adaptive behavior. The paper integrates predictive coding, active inference, and self-organization within a unifying Bayesian framework.
    key_takeaways:
      - Establishes formal equivalence between predictive coding and free-energy minimization.
      - Links perception and action to generative model updates.
      - Provides theoretical scaffold for comparing NDT's denoising process to Bayesian inference dynamics.
      - Foundation for hierarchical self-prior architecture in RTB.
    tags: [RTB-core]

  - id: obyrne_jerbi_2022_criticality_review
    authors:
      - Jordan O'Byrne
      - Karim Jerbi
    title: "How critical is brain criticality?"
    doi: 10.1038/s41593-017-0020-1
    citation: "O'Byrne J & Jerbi K (2022). How critical is brain criticality? *Trends Neurosci* 45(11):820-837."
    abstract: |
      This review examines the hypothesis that the brain operates at the edge of a critical phase transition between order and disorder, focusing on avalanche and edge-of-chaos criticality. The authors discuss how critical dynamics provide computational features that link neuronal dynamics to cognition, suggesting that near-criticality may be more plausible than strict criticality for brain operation, with distance to criticality as a promising biological parameter for characterizing cognitive differences and mental illness.
    key_takeaways:
      - Brain criticality hypothesis links neuronal dynamics to cognition through emergent computational features.
      - Near-criticality may be more plausible than strict criticality for brain operation.
      - Distance to criticality represents a promising biological parameter for cognitive and clinical characterization.
    tags: [NDHI, RTB-core]

  - id: jacobson_et_al_2013_theta_gamma_aging
    authors:
      - Tara K. Jacobson
      - Matthew D. Howe
      - Brandy Schmidt
      - James R. Hinman
      - Monty A. Escabí
      - Etan J. Markus
    title: "Hippocampal theta, gamma, and theta-gamma coupling: effects of aging, environmental change, and cholinergic activation"
    doi: 10.1152/jn.00409.2012
    citation: "Jacobson TK et al. (2013). Hippocampal theta, gamma, and theta-gamma coupling: effects of aging, environmental change, and cholinergic activation. *J Neurophysiol* 109(7):1852-1865."
    abstract: |
      This study examines hippocampal theta and gamma oscillations and their coupling in adult and old rats during exploration of familiar and novel maze configurations, with and without cholinergic activation via physostigmine. Results show age-related decreases in theta-gamma coupling and theta power during novel exploration, with cholinergic activation reversing some age-related deficits, supporting a role for theta and the cholinergic system in encoding new information.
    key_takeaways:
      - Age-related decreases in theta-gamma coupling and theta power during novel exploration.
      - Cholinergic activation via physostigmine can reverse some age-related hippocampal oscillatory deficits.
      - Theta oscillations and cholinergic system play crucial roles in encoding new environmental information.
    tags: [RVC, RTB-core]

papers_batch_10:
  - id: clark_2013_predictive_brains_situated_agents
    authors:
      - Andy Clark
    title: "Whatever next? Predictive brains, situated agents, and the future of cognitive science"
    doi: 10.1017/S0140525X12000477
    citation: "Clark A (2013). Whatever next? Predictive brains, situated agents, and the future of cognitive science. *Behav Brain Sci* 36(3):181-204."
    abstract: |
      This target article critically examines the "hierarchical prediction machine" approach to brain function, arguing that brains are essentially prediction machines that constantly attempt to match incoming sensory inputs with top-down expectations. The approach offers a unifying model of perception and action, illuminates the functional role of attention, and may capture the special contribution of cortical processing to adaptive success, potentially providing the best clue yet to a unified science of mind and action.
    key_takeaways:
      - Brains function as hierarchical prediction machines minimizing prediction error.
      - Offers unifying model of perception and action through predictive coding.
      - Provides framework for understanding attention and cortical processing contributions.
    tags: [RTB-core]

  - id: critchley_harrison_2013_visceral_influences_brain_behavior
    authors:
      - Hugo D. Critchley
      - Neil A. Harrison
    title: "Visceral influences on brain and behavior"
    doi: 10.1016/j.neuron.2013.02.008
    citation: "Critchley HD & Harrison NA (2013). Visceral influences on brain and behavior. *Neuron* 79(2):234-246."
    abstract: |
      This perspective reviews how mental processes and their neural substrates are intimately linked to homeostatic control of internal bodily state through distinct interoceptive pathways. The anatomical organization of these pathways and their psychological/behavioral expressions appear along discrete, evolutionarily conserved dimensions, providing sources of biases to perception, cognition, emotion, and behavior, and arguably forming the dynamic basis of the concept of self.
    key_takeaways:
      - Mental processes are intimately linked to homeostatic control of internal bodily state.
      - Distinct interoceptive pathways provide biases to perception, cognition, emotion, and behavior.
      - Visceral influences form the dynamic basis of the concept of self.
    tags: [EAP, RTB-core]

  - id: shew_plenz_2012_functional_benefits_criticality_cortex
    authors:
      - Woodrow L. Shew
      - Dietmar Plenz
    title: "The functional benefits of criticality in the cortex"
    doi: 10.1177/1073858412445487
    citation: "Shew WL & Plenz D (2012). The functional benefits of criticality in the cortex. *Neuroscientist* 19(1):88-100."
    abstract: |
      This review examines the functional benefits of criticality in cortical networks, focusing on how critical dynamics optimize information processing, signal propagation, and computational capabilities. The authors discuss evidence for criticality in neural systems and its implications for understanding brain function, suggesting that operating near critical points provides optimal balance between order and disorder for information processing.
    key_takeaways:
      - Critical dynamics optimize information processing and signal propagation in cortical networks.
      - Operating near critical points provides optimal balance between order and disorder.
      - Criticality enhances computational capabilities and functional benefits in neural systems.
    tags: [NDHI, RTB-core]

  - id: lewis_et_al_2015_trn_fast_local_arousal_modulation
    authors:
      - Laura D. Lewis
      - Jakob Voigts
      - Francisco J. Flores
      - L. Ian Schmitt
      - Matthew A. Wilson
      - Michael M. Halassa
      - Emery N. Brown
    title: "Thalamic reticular nucleus induces fast and local modulation of arousal state"
    doi: 10.7554/eLife.08760
    citation: "Lewis LD et al. (2015). Thalamic reticular nucleus induces fast and local modulation of arousal state. *eLife* 4:e08760."
    abstract: |
      Using optogenetics and whole cortex electrophysiology, this study demonstrates that local tonic activation of the thalamic reticular nucleus (TRN) rapidly induces slow wave activity in spatially restricted cortical regions. These slow waves resemble those seen in sleep, with cortical units undergoing periods of silence phase-locked to the slow wave, and animals exhibit behavioral changes consistent with decreased arousal state during TRN stimulation.
    key_takeaways:
      - TRN activation rapidly induces local slow wave activity in spatially restricted cortical regions.
      - TRN-mediated slow waves resemble sleep-like activity with cortical silence periods.
      - Provides mechanism for fast, local modulation of cortical arousal state.
    tags: [TRN-VG, RVC]

  - id: fernandez_et_al_2018_trn_local_sleep_sensory_cortex
    authors:
      - Laura M.J. Fernandez
      - Gil Vantomme
      - Alejandro Osorio-Forero
      - Romain Cardis
      - Elidie Béard
      - Anita Lüthi
    title: "Thalamic reticular control of local sleep in mouse sensory cortex"
    doi: 10.7554/eLife.39111
    citation: "Fernandez LMJ et al. (2018). Thalamic reticular control of local sleep in mouse sensory cortex. *eLife* 7:e39111."
    abstract: |
      This study identifies the thalamic reticular nucleus (TRN) as a source for local, sensory-cortex-specific non-REM sleep in mice. Sensory TRN sectors show stronger repetitive burst discharge due to higher CaV3.3 channel activity, regulating major NREMS rhythms in sensory but not non-sensory cortical areas. The findings indicate heterogeneity in forebrain oscillators contributing to sensory-cortex-specific and dually regulated NREMS.
    key_takeaways:
      - TRN provides local, sensory-cortex-specific non-REM sleep regulation.
      - Sensory TRN sectors show stronger burst discharge due to CaV3.3 channel activity.
      - Enables local sleep regulation according to use- and experience-dependence.
    tags: [TRN-VG, RVC]

  - id: isomura_et_al_2021_canonical_networks_active_inference
    authors:
      - Takuya Isomura
      - Hideaki Shimazaki
      - Karl J. Friston
    title: "Canonical neural networks perform active inference"
    doi: 10.1038/s42003-021-02994-2
    citation: "Isomura T et al. (2021). Canonical neural networks perform active inference. *Commun Biol* 4:1026."
    abstract: |
      This work shows that canonical neural networks comprising rate coding models, where neural activity and plasticity minimize a common cost function with delayed plasticity modulation, implicitly perform active inference to minimize risk associated with future outcomes. Mathematical analyses demonstrate this biological optimization can be cast as maximization of model evidence or minimization of variational free energy under a partially observed Markov decision process model.
    key_takeaways:
      - Canonical neural networks implicitly perform active inference through delayed plasticity modulation.
      - Biological optimization equivalent to variational free energy minimization.
      - Provides universal characterization of neural networks in terms of Bayesian belief updating.
    tags: [RTB-core]

  - id: zaccaro_et_al_2024_attention_cardiac_sensations_hep_exhalation
    authors:
      - Andrea Zaccaro
      - Francesca della Penna
      - Elena Mussini
      - Eleonora Parrotta
      - Mauro Gianni Perrucci
      - Marcello Costantini
      - Francesca Ferri
    title: "Attention to cardiac sensations enhances the heartbeat-evoked potential during exhalation"
    doi: 10.1016/j.isci.2024.109586
    citation: "Zaccaro A et al. (2024). Attention to cardiac sensations enhances the heartbeat-evoked potential during exhalation. *iScience* 27(4):109586."
    abstract: |
      This study examines how attention to cardiac sensations modulates heartbeat-evoked potentials (HEPs) during different respiratory phases. Results show that late HEP positivity increases during interoceptive tasks, early HEP negativity increases non-specifically during exhalation, and late HEP increases specifically in cardiac interoceptive tasks at exhalation. HEPs recorded at exhalation are linked to mindfulness and interoceptive sensibility.
    key_takeaways:
      - Attention to cardiac sensations enhances HEPs during exhalation phases.
      - Late HEP positivity specifically increases during interoceptive attention tasks.
      - HEPs at exhalation correlate with mindfulness and interoceptive sensibility measures.
    tags: [EAP, RTB-core]

  - id: crandall_et_al_2015_cortico_thalamo_cortical_loop_review
    authors:
      - Samuel R. Crandall
      - Patrick L. Cruikshank
      - Michael M. Halassa
    title: "Untangling the cortico-thalamo-cortical loop: cellular pieces of a knotty circuit puzzle"
    doi: 10.1016/j.conb.2015.01.006
    citation: "Crandall SR et al. (2015). Untangling the cortico-thalamo-cortical loop: cellular pieces of a knotty circuit puzzle. *Curr Opin Neurobiol* 32:53-59."
    abstract: |
      This review examines the complex circuitry of the cortico-thalamo-cortical loop, focusing on cellular components and their functional roles. The authors discuss how cortical layer 5 pyramidal cells, thalamic relay neurons, and thalamic reticular nucleus neurons interact to create dynamic gating mechanisms that control information flow and attention, providing insights into the cellular basis of thalamocortical function.
    key_takeaways:
      - Cortico-thalamo-cortical loop involves complex interactions between cortical and thalamic neurons.
      - Layer 5 pyramidal cells play key role in thalamocortical communication.
      - Dynamic gating mechanisms control information flow and attention through thalamic circuits.
    tags: [TRN-VG, RTB-core]

  - id: tognoli_kelso_2014_metastable_brain_review
    authors:
      - Emmanuelle Tognoli
      - J.A. Scott Kelso
    title: "The metastable brain"
    doi: 10.1016/j.neuron.2013.12.022
    citation: "Tognoli E & Kelso JAS (2014). The metastable brain. *Neuron* 81(1):35-48."
    abstract: |
      This review examines metastability as a fundamental principle of brain organization, where the brain operates in a dynamic regime between order and disorder. The authors discuss how metastable dynamics enable flexible coordination of neural activity across spatial and temporal scales, providing a framework for understanding how the brain maintains stability while allowing for rapid transitions between different functional states.
    key_takeaways:
      - Metastability represents fundamental principle of brain organization between order and disorder.
      - Enables flexible coordination of neural activity across spatial and temporal scales.
      - Provides framework for understanding brain stability with rapid state transitions.
    tags: [NDHI, RTB-core]

papers_batch_11:
  - id: runfola_et_al_2025_low_dimensional_structures_brain_dynamics
    authors:
      - Claudio Runfola
      - Viktor Jirsa
      - Spase Petkoski
      - Hiba Sheheitli
      - Christophe Bernard
      - Anthony R. McIntosh
    title: "A mechanism for the emergence of low-dimensional structures in brain dynamics"
    doi: 10.1038/s41540-025-00499-w
    citation: "Runfola C et al. (2025). A mechanism for the emergence of low-dimensional structures in brain dynamics. *npj Syst Biol Appl* 1:25."
    abstract: |
      This study investigates mechanisms underlying the emergence of low-dimensional structures in brain dynamics, examining how complex neural networks reduce to simpler, tractable representations. The authors explore the mathematical and biological principles that enable the brain to operate efficiently through dimensionality reduction while maintaining functional complexity across different spatial and temporal scales.
    key_takeaways:
      - Identifies mechanisms for emergence of low-dimensional structures in brain dynamics.
      - Explains how complex neural networks reduce to simpler, tractable representations.
      - Provides mathematical framework for understanding brain efficiency through dimensionality reduction.
    tags: [NDHI, RTB-core]

  - id: mahdavi_et_al_2023_ketamine_spindles_delta_oscillations
    authors:
      - Mahdavi A
      - Qin Y
      - Aubry A-S
      - Cornec D
      - Kulikova S
      - Pinault D
    title: "A single psychotomimetic dose of ketamine decreases thalamocortical spindles and delta oscillations in the sedated rat"
    doi: 10.1016/j.neuropharm.2023.109612
    citation: "Mahdavi A et al. (2023). A single psychotomimetic dose of ketamine decreases thalamocortical spindles and delta oscillations in the sedated rat. *Neuropharmacology* 235:109612."
    abstract: |
      This study examines the effects of a single psychotomimetic dose of ketamine on thalamocortical spindles and delta oscillations in sedated rats. Results demonstrate that ketamine significantly reduces sleep spindle activity and delta oscillations, providing insights into the neurobiological mechanisms underlying ketamine's psychotomimetic effects and its impact on thalamocortical rhythmic activity.
    key_takeaways:
      - Ketamine reduces thalamocortical spindle activity and delta oscillations.
      - Provides neurobiological insights into ketamine's psychotomimetic effects.
      - Demonstrates ketamine's impact on thalamocortical rhythmic activity patterns.
    tags: [TRN-VG, RVC]

  - id: wang_et_al_2023_critical_like_dynamics_phase_transitions
    authors:
      - Sheng H. Wang
      - Felix Siebenhühner
      - Gabriele Arnulfo
      - Vladislav Myrov
      - Lino Nobili
      - Michael Breakspear
      - Satu Palva
      - J. Matias Palva
    title: "Critical-like brain dynamics in a continuum from second- to first-order phase transition"
    doi: 10.1523/JNEUROSCI.0980-23.2023
    citation: "Wang SH et al. (2023). Critical-like brain dynamics in a continuum from second- to first-order phase transition. *J Neurosci* 43(45):7642-7656."
    abstract: |
      This study investigates critical-like brain dynamics operating in a continuum between second- and first-order phase transitions. Using computational modeling and empirical data from MEG and SEEG, the authors demonstrate that bistable synchronization dynamics emerge through elevated positive feedback and occur exclusively in critical-like regimens, revealing the human brain as a complex system exhibiting critical-like dynamics across different phase transition types.
    key_takeaways:
      - Brain operates in continuum between second- and first-order phase transitions.
      - Bistable synchronization dynamics emerge through elevated positive feedback.
      - Moderate bistability correlates with task performance, excessive bistability with epilepsy.
    tags: [NDHI, RTB-core]

  - id: cocchi_et_al_2017_criticality_brain_synthesis_review
    authors:
      - Luca Cocchi
      - Leonardo L. Gollo
      - Andrew Zalesky
      - Michael Breakspear
    title: "Criticality in the brain: a synthesis of neurobiology, models and cognition"
    doi: 10.1016/j.tins.2017.01.001
    citation: "Cocchi L et al. (2017). Criticality in the brain: a synthesis of neurobiology, models and cognition. *Trends Neurosci* 40(2):87-95."
    abstract: |
      This review synthesizes evidence for criticality in the brain, examining how multi-scale processes arise from critical phenomena that occur broadly in natural systems. The authors discuss criticality as a unifying framework for understanding brain activity and cognitive function, reviewing evidence supporting the hypothesis that the brain operates near criticality and its explanatory potential in brain health and disease.
    key_takeaways:
      - Criticality provides unifying framework for brain activity and cognitive function.
      - Substantial evidence supports hypothesis that brain operates near criticality.
      - Criticality explains multi-scale processes in healthy and pathological brain dynamics.
    tags: [NDHI, RTB-core]

  - id: ho_et_al_2020_denoising_diffusion_probabilistic_models
    authors:
      - Jonathan Ho
      - Ajay Jain
      - Pieter Abbeel
    title: "Denoising diffusion probabilistic models"
    doi: 10.5555/3495724.3495883
    citation: "Ho J et al. (2020). Denoising diffusion probabilistic models. *Advances in Neural Information Processing Systems* 33:6840-6851."
    abstract: |
      This paper presents high-quality image synthesis results using diffusion probabilistic models, a class of latent variable models inspired by nonequilibrium thermodynamics. The authors demonstrate that diffusion models naturally admit a progressive lossy decompression scheme and achieve state-of-the-art results on CIFAR10 and LSUN datasets, providing a foundation for understanding denoising processes in generative modeling.
    key_takeaways:
      - Diffusion probabilistic models achieve state-of-the-art image synthesis results.
      - Models naturally admit progressive lossy decompression scheme.
      - Provides foundation for understanding denoising processes in generative modeling.
    tags: [RTB-core]

  - id: brehmer_cranmer_2020_manifold_learning_flows
    authors:
      - Johann Brehmer
      - Kyle Cranmer
    title: "Flows for simultaneous manifold learning and density estimation"
    doi: 10.5555/3495724.3495883
    citation: "Brehmer J & Cranmer K (2020). Flows for simultaneous manifold learning and density estimation. *Advances in Neural Information Processing Systems* 33:4428-4439."
    abstract: |
      This paper introduces manifold-learning flows (M-flows), a new class of generative models that simultaneously learn the data manifold and a tractable probability density on that manifold. Combining aspects of normalizing flows, GANs, autoencoders, and energy-based models, M-flows provide better inference than standard flows in ambient data space by learning the underlying manifold structure.
    key_takeaways:
      - M-flows simultaneously learn data manifold and tractable probability density.
      - Combine aspects of normalizing flows, GANs, autoencoders, and energy-based models.
      - Provide better inference by learning underlying manifold structure.
    tags: [RTB-core]

  - id: crabtree_2018_functional_diversity_trn_subnetworks_review
    authors:
      - John W. Crabtree
    title: "Functional diversity of thalamic reticular subnetworks"
    doi: 10.3389/fnsys.2018.00041
    citation: "Crabtree JW (2018). Functional diversity of thalamic reticular subnetworks. *Front Syst Neurosci* 12:41."
    abstract: |
      This review examines the functional organization of the thalamic reticular nucleus (TRN), identifying an array of functionally distinct subnetworks that participate in sensory, motor, and cognitive processes. The author discusses how different TRN subnetworks connect with various types of thalamic projection neurons, mediating bottom-up, top-down, and internuclear attentional processes through their different functional connections.
    key_takeaways:
      - TRN contains functionally distinct subnetworks for sensory, motor, and cognitive processes.
      - Different subnetworks connect with various types of thalamic projection neurons.
      - TRN subnetworks mediate bottom-up, top-down, and internuclear attentional processes.
    tags: [TRN-VG, RTB-core]

  - id: song_ermon_2019_generative_modeling_gradients_review
    authors:
      - Yang Song
      - Stefano Ermon
    title: "Generative modeling by estimating gradients of the data distribution"
    doi: 10.5555/3454287.3455080
    citation: "Song Y & Ermon S (2019). Generative modeling by estimating gradients of the data distribution. *Advances in Neural Information Processing Systems* 32:11895-11907."
    abstract: |
      This paper presents a new approach to generative modeling by estimating gradients of the data distribution using score matching. The authors demonstrate how to train generative models by learning to estimate these gradients, providing a foundation for understanding how neural networks can learn to model complex data distributions through gradient estimation techniques.
    key_takeaways:
      - New approach to generative modeling through gradient estimation of data distribution.
      - Uses score matching to train generative models.
      - Provides foundation for neural networks learning complex data distributions.
    tags: [RTB-core]
