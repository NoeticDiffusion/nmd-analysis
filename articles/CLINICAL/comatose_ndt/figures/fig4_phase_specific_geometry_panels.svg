<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Phase-specific geometry panels across the first 12 hours</title>
  <desc id="desc">Three-panel schematic showing immediate reachability divergence, later rotational divergence, and delayed manifold redistribution across the first 12 hours.</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #475569; }
      .panel-title { font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; }
      .panel-sub { font-family: Arial, sans-serif; font-size: 16px; fill: #475569; }
      .axis { font-family: Arial, sans-serif; font-size: 15px; fill: #334155; }
      .caption { font-family: Arial, sans-serif; font-size: 17px; fill: #334155; }
      .goodlab { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #2563eb; }
      .poorlab { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #dc2626; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="60" y="58" class="title">Three complementary panels for the current `0-12 h` story</text>
  <text x="60" y="92" class="subtitle">Designed as editable SVG scaffolds: one main panel for immediate reachability, one supporting panel for delayed rotation, and one for later manifold redistribution.</text>

  <!-- Panel 1 -->
  <rect x="70" y="135" width="1260" height="205" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="170" class="panel-title">Panel A. Immediate reachability split</text>
  <text x="100" y="196" class="panel-sub">Anchor metric: `tube_log_det_median`. Supporting early metrics: `tube_capture_gate_median`, `q_ratio_h4_median`.</text>

  <rect x="135" y="220" width="610" height="80" rx="14" fill="#eff6ff"/>
  <text x="155" y="250" class="caption">Recommended visual:</text>
  <text x="310" y="250" class="caption">two-group line plot or ribbon plot over `0-1 h` to `11-12 h`, with hour 1 highlighted</text>
  <text x="155" y="278" class="caption">and a side annotation stating that the clearest immediate divergence is already present in the first monitored hour.</text>

  <g transform="translate(830,215)">
    <rect x="0" y="0" width="430" height="95" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="40" y1="65" x2="390" y2="65" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="20" x2="40" y2="75" stroke="#475569" stroke-width="1.5"/>
    <rect x="40" y="20" width="28" height="55" fill="#dbeafe" opacity="0.75"/>
    <path d="M 40 58 C 105 38, 190 42, 390 55" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M 40 35 C 105 18, 190 25, 390 42" fill="none" stroke="#dc2626" stroke-width="4"/>
    <text x="290" y="24" class="poorlab">Poor</text>
    <text x="290" y="73" class="goodlab">Good</text>
    <text x="46" y="90" class="axis">Hour 1 highlighted</text>
  </g>

  <!-- Panel 2 -->
  <rect x="70" y="370" width="1260" height="205" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="405" class="panel-title">Panel B. Rotational divergence emerges later</text>
  <text x="100" y="431" class="panel-sub">Anchor metric: `rotational_power_median`. Suggested emphasis: weak early tendency, clearer split around `4-5 h` and beyond.</text>

  <rect x="135" y="455" width="610" height="82" rx="14" fill="#fff7ed"/>
  <text x="155" y="485" class="caption">Recommended visual:</text>
  <text x="310" y="485" class="caption">a delayed-onset line plot with soft shading for `0-4 h` and a stronger annotation over `4-7 h`.</text>
  <text x="155" y="513" class="caption">This panel works best as a supporting figure that says: the rotation story is real, but it is not the first-hour driver.</text>

  <g transform="translate(830,450)">
    <rect x="0" y="0" width="430" height="95" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="40" y1="65" x2="390" y2="65" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="20" x2="40" y2="75" stroke="#475569" stroke-width="1.5"/>
    <rect x="160" y="20" width="90" height="55" fill="#ffedd5" opacity="0.75"/>
    <path d="M 40 60 C 120 61, 170 59, 220 56 C 280 53, 335 51, 390 49" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M 40 52 C 120 50, 170 42, 220 34 C 280 30, 335 28, 390 25" fill="none" stroke="#dc2626" stroke-width="4"/>
    <text x="170" y="90" class="axis">4-7 h highlighted</text>
    <text x="295" y="26" class="poorlab">Poor higher</text>
    <text x="282" y="74" class="goodlab">Good lower</text>
  </g>

  <!-- Panel 3 -->
  <rect x="70" y="605" width="1260" height="205" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="100" y="640" class="panel-title">Panel C. Redistribution metrics separate after the first hours</text>
  <text x="100" y="666" class="panel-sub">Anchor metric: `d_n_median`. Suggested emphasis: delayed onset around `4-7 h`, then persistent support into `11-12 h`.</text>

  <rect x="135" y="690" width="610" height="82" rx="14" fill="#eff6ff"/>
  <text x="155" y="720" class="caption">Recommended visual:</text>
  <text x="310" y="720" class="caption">a later-rising separation panel showing that `d_n_median` behaves less like an immediate marker and more like</text>
  <text x="155" y="748" class="caption">a secondary readout of trajectories that have already begun to diverge.</text>

  <g transform="translate(830,685)">
    <rect x="0" y="0" width="430" height="95" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="40" y1="65" x2="390" y2="65" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="20" x2="40" y2="75" stroke="#475569" stroke-width="1.5"/>
    <rect x="160" y="20" width="90" height="55" fill="#dbeafe" opacity="0.75"/>
    <path d="M 40 60 C 120 62, 170 55, 220 43 C 280 34, 335 26, 390 20" fill="none" stroke="#2563eb" stroke-width="4"/>
    <path d="M 40 60 C 120 61, 170 67, 220 69 C 280 72, 335 72, 390 73" fill="none" stroke="#dc2626" stroke-width="4"/>
    <text x="165" y="90" class="axis">Delayed divergence window</text>
    <text x="300" y="23" class="goodlab">Good higher later</text>
    <text x="300" y="76" class="poorlab">Poor flatter / lower</text>
  </g>
</svg>
