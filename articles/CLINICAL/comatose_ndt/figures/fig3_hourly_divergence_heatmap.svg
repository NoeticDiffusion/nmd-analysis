    <rect x="2" y="188" width="75" height="58" fill="#60a5fa" opacity="0.40"/>
    <rect x="81" y="188" width="75" height="58" fill="#2563eb" opacity="0.52"/>
    <rect x="160" y="188" width="75" height="58" fill="#93c5fd" opacity="0.40"/>
    <rect x="239" y="188" width="75" height="58" fill="#2563eb" opacity="0.50"/>
    <rect x="318" y="188" width="75" height="58" fill="#bfdbfe" opacity="0.30"/>
    <rect x="397" y="188" width="75" height="58" fill="#dbeafe" opacity="0.26"/>
    <rect x="476" y="188" width="75" height="58" fill="#e2e8f0" opacity="0.24"/>
    <rect x="555" y="188" width="75" height="58" fill="#f8fafc" opacity="1"/>
    <rect x="634" y="188" width="75" height="58" fill="#f8fafc" opacity="1"/>
    <rect x="713" y="188" width="75" height="58" fill="#fef2f2" opacity="0.18"/>
    <rect x="792" y="188" width="75" height="58" fill="#fef2f2" opacity="0.20"/>
    <rect x="871" y="188" width="75" height="58" fill="#fef2f2" opacity="0.20"/>

    <!-- row 5: rotational power delayed red -->
    <rect x="2" y="250" width="75" height="58" fill="#fca5a5" opacity="0.36"/>
    <rect x="81" y="250" width="75" height="58" fill="#fecaca" opacity="0.22"/>
    <rect x="160" y="250" width="75" height="58" fill="#fee2e2" opacity="0.18"/>
