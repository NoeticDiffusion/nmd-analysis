    <rect x="2" y="64" width="75" height="58" fill="#b91c1c" opacity="0.95"/>
    <rect x="81" y="64" width="75" height="58" fill="#ef4444" opacity="0.52"/>
    <rect x="160" y="64" width="75" height="58" fill="#fca5a5" opacity="0.42"/>
    <rect x="239" y="64" width="75" height="58" fill="#fecaca" opacity="0.36"/>
    <rect x="318" y="64" width="75" height="58" fill="#fde68a" opacity="0.34"/>
    <rect x="397" y="64" width="75" height="58" fill="#fef3c7" opacity="0.32"/>
    <rect x="476" y="64" width="75" height="58" fill="#dbeafe" opacity="0.26"/>
