    <rect x="397" y="2" width="75" height="58" fill="#ef4444" opacity="0.58"/>
    <rect x="476" y="2" width="75" height="58" fill="#dc2626" opacity="0.64"/>
    <rect x="555" y="2" width="75" height="58" fill="#dc2626" opacity="0.62"/>
    <rect x="634" y="2" width="75" height="58" fill="#dc2626" opacity="0.60"/>
    <rect x="713" y="2" width="75" height="58" fill="#dc2626" opacity="0.58"/>
    <rect x="792" y="2" width="75" height="58" fill="#dc2626" opacity="0.56"/>
    <rect x="871" y="2" width="75" height="58" fill="#dc2626" opacity="0.58"/>

