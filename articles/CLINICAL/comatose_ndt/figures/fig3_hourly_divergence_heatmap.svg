    <rect x="318" y="312" width="75" height="58" fill="#2563eb" opacity="0.90"/>
    <rect x="397" y="312" width="75" height="58" fill="#60a5fa" opacity="0.72"/>
    <rect x="476" y="312" width="75" height="58" fill="#1d4ed8" opacity="0.78"/>
    <rect x="555" y="312" width="75" height="58" fill="#93c5fd" opacity="0.50"/>
    <rect x="634" y="312" width="75" height="58" fill="#60a5fa" opacity="0.56"/>
    <rect x="713" y="312" width="75" height="58" fill="#93c5fd" opacity="0.48"/>
    <rect x="792" y="312" width="75" height="58" fill="#60a5fa" opacity="0.54"/>
    <rect x="871" y="312" width="75" height="58" fill="#2563eb" opacity="0.66"/>

    <!-- hour 1 markers -->
    <text x="30" y="38" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">*</text>
    <text x="30" y="100" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">*</text>
    <text x="30" y="162" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">*</text>
  </g>

  <rect x="255" y="596" width="950" height="110" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="280" y="630" class="rowlab">Reading guide</text>
  <text x="280" y="658" class="legend">The current pilot pattern looks like a temporal sequence rather than a single simultaneous biomarker event.</text>
  <text x="280" y="682" class="legend">Immediate hour-1 divergence is strongest in reachability (`tube_log_det_median`, `tube_capture_gate_median`, `q_ratio_h4_median`), while `rotational_power_median` and `d_n_median` become clearer later, especially around `4-7 h`.</text>

  <rect x="60" y="608" width="28" height="28" fill="#1d4ed8" opacity="0.85"/>
  <text x="98" y="628" class="legend">Good &gt; Poor</text>
  <rect x="60" y="648" width="28" height="28" fill="#dc2626" opacity="0.85"/>
  <text x="98" y="668" class="legend">Poor &gt; Good</text>
  <rect x="60" y="688" width="28" height="28" fill="#94a3b8" opacity="0.35"/>
  <text x="98" y="708" class="legend">Weak / transitional</text>
</svg>
