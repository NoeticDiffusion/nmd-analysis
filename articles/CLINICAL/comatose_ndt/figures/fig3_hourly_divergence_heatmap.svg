    <rect x="318" y="250" width="75" height="58" fill="#dc2626" opacity="0.82"/>
    <rect x="397" y="250" width="75" height="58" fill="#ef4444" opacity="0.66"/>
    <rect x="476" y="250" width="75" height="58" fill="#dc2626" opacity="0.74"/>
    <rect x="555" y="250" width="75" height="58" fill="#ef4444" opacity="0.60"/>
