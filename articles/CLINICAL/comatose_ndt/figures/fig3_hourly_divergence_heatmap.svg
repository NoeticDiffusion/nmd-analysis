<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="760" viewBox="0 0 1380 760" role="img" aria-labelledby="title desc">
  <title id="title">Hourly divergence heatmap across the first 12 hours</title>
  <desc id="desc">Schematic hourly heatmap for six key metrics, showing immediate first-hour reachability separation and later-emerging rotational and redistribution differences.</desc>

  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 34px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, sans-serif; font-size: 18px; fill: #475569; }
      .rowlab { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .hourlab { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #1f2937; }
      .small { font-family: Arial, sans-serif; font-size: 15px; fill: #475569; }
      .legend { font-family: Arial, sans-serif; font-size: 16px; fill: #334155; }
    </style>
  </defs>

  <rect width="1380" height="760" fill="#f8fafc"/>

  <text x="60" y="56" class="title">Hourly divergence map across the first 12 h</text>
  <text x="60" y="88" class="subtitle">Schematic pilot summary to be updated with the full cohort. Blue: Good &gt; Poor. Red: Poor &gt; Good. Darker shading indicates clearer separation.</text>

  <rect x="255" y="132" width="950" height="435" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="255" y="132" width="79" height="435" fill="#eff6ff"/>
  <rect x="334" y="132" width="237" height="435" fill="#f8fafc"/>
  <rect x="571" y="132" width="237" height="435" fill="#fffbeb"/>
  <rect x="808" y="132" width="397" height="435" fill="#f0fdf4"/>

  <text x="272" y="118" class="small">0-1 h</text>
  <text x="415" y="118" class="small">1-4 h transition</text>
  <text x="655" y="118" class="small">4-7 h secondary onset</text>
  <text x="955" y="118" class="small">7-12 h broader divergence</text>

  <text x="95" y="185" class="rowlab">tube_log_det_median</text>
  <text x="95" y="247" class="rowlab">tube_capture_gate_median</text>
  <text x="95" y="309" class="rowlab">q_ratio_h4_median</text>
  <text x="95" y="371" class="rowlab">tube_d_eff_median</text>
  <text x="95" y="433" class="rowlab">rotational_power_median</text>
  <text x="95" y="495" class="rowlab">d_n_median</text>

  <g transform="translate(255,132)">
    <!-- hour labels -->
    <text x="18" y="-12" class="hourlab">0-1</text>
    <text x="97" y="-12" class="hourlab">1-2</text>
    <text x="176" y="-12" class="hourlab">2-3</text>
    <text x="255" y="-12" class="hourlab">3-4</text>
    <text x="334" y="-12" class="hourlab">4-5</text>
    <text x="413" y="-12" class="hourlab">5-6</text>
    <text x="492" y="-12" class="hourlab">6-7</text>
    <text x="571" y="-12" class="hourlab">7-8</text>
    <text x="650" y="-12" class="hourlab">8-9</text>
    <text x="729" y="-12" class="hourlab">9-10</text>
    <text x="808" y="-12" class="hourlab">10-11</text>
    <text x="887" y="-12" class="hourlab">11-12</text>

    <!-- grid -->
    <g stroke="#cbd5e1" stroke-width="1">
      <path d="M 0 0 H 948"/>
      <path d="M 0 62 H 948"/>
      <path d="M 0 124 H 948"/>
      <path d="M 0 186 H 948"/>
      <path d="M 0 248 H 948"/>
      <path d="M 0 310 H 948"/>
      <path d="M 0 372 H 948"/>
      <path d="M 0 434 H 948"/>
      <path d="M 0 0 V 434"/>
      <path d="M 79 0 V 434"/>
      <path d="M 158 0 V 434"/>
