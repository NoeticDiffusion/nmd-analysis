    <!-- row 1: tube_log_det_median, Good lower than Poor -> red-style directionality as separation marker -->
    <rect x="2" y="2" width="75" height="58" fill="#b91c1c" opacity="0.92"/>
    <rect x="81" y="2" width="75" height="58" fill="#ef4444" opacity="0.70"/>
    <rect x="160" y="2" width="75" height="58" fill="#ef4444" opacity="0.56"/>
    <rect x="239" y="2" width="75" height="58" fill="#ef4444" opacity="0.54"/>
