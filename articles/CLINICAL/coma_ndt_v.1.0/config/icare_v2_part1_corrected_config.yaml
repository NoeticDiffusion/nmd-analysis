# Part1 (0-12h), re-ingested 2026-09-11 with the Jacobian fit-fidelity gate,
# ComBat harmonization (batch_key=hospital), cohort-anchored coords, and the
# conventional_eeg pack. Same 161-subject population as bundle
# 20260904_225047 (+1 extra grouped subject), restricted at ingest to
# filename hours 000-012 via exclude_files. Supersedes bundle 20260904_225047
