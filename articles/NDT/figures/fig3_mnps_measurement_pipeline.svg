<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">MNPS measurement pipeline</title>
  <desc id="desc">Neural recordings are windowed into m, d, e coordinates; appendix Atlas tools analyze trajectories.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">MNPS measurement pipeline</text>
  <text x="60" y="92" font-family="Arial, sans-serif" font-size="17" fill="#475569">Main text: canonical 3D MNPS trajectory. Appendix: Atlas readouts and optional NDHI composite.</text>

  <rect x="70" y="150" width="210" height="130" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="175" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#075985">Neural data</text>
  <text x="175" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0c4a6e">EEG / MEG / fMRI</text>
  <text x="175" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0c4a6e">cleaned windows</text>

  <rect x="350" y="115" width="250" height="200" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">Feature families</text>
  <rect x="385" y="178" width="180" height="32" rx="8" fill="#fee2e2"/><text x="475" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#7f1d1d">e: entropy / disorder</text>
  <rect x="385" y="223" width="180" height="32" rx="8" fill="#dbeafe"/><text x="475" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e3a8a">m: rhythmic coherence</text>
  <rect x="385" y="268" width="180" height="32" rx="8" fill="#dcfce7"/><text x="475" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#14532d">d: metastability deviation</text>

  <rect x="675" y="150" width="220" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="785" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#78350f">3D MNPS</text>
  <text x="785" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#92400e">X(t) = [m, d, e]</text>
  <text x="785" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#92400e">within-subject scaled</text>

  <rect x="970" y="115" width="170" height="200" rx="18" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="153" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#581c87">Appendix</text>
  <text x="1055" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b21a8">Atlas streams</text>
  <text x="1055" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b21a8">TDA / RQA</text>
  <text x="1055" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b21a8">metastability</text>
  <text x="1055" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#6b21a8">optional NDHI</text>

  <path d="M 282 215 L 342 215" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 602 215 L 667 215" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 897 215 L 962 215" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="8 6"/>

  <rect x="170" y="410" width="860" height="120" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="600" y="448" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Reviewer-facing rule</text>
  <text x="600" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">Core NDT tests use the trajectory, rhythm proxy, and prespecified contrasts.</text>
  <text x="600" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#334155">Atlas and NDHI summarize readouts; they do not add a separate consciousness score.</text>
</svg>
