<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Noetic Diffusion Theory core flow</title>
  <desc id="desc">Rhythms control variance, variance gates denoising on a learned landscape, and MNPS makes trajectories measurable.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">NDT core: rhythmically scheduled denoising on a learned manifold</text>
  <text x="60" y="92" font-family="Arial, sans-serif" font-size="17" fill="#475569">Stage-1 claim: event-locked rhythm proxies should predict measurable geometry and entropy changes.</text>

  <rect x="70" y="145" width="230" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text x="185" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1e3a8a">Rhythms r(t)</text>
  <text x="185" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">theta-gamma PAC</text>
  <text x="185" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1e40af">SO-spindle events</text>

  <rect x="382" y="145" width="230" height="120" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="497" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#7f1d1d">Variance sigma(t)</text>
  <text x="497" y="216" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">high r -> low sigma</text>
  <text x="497" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#991b1b">low r -> exploration</text>

  <rect x="694" y="145" width="230" height="120" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="809" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#14532d">MNDM state X(t)</text>
  <text x="809" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#166534">dX = -grad F dt</text>
  <text x="809" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#166534">+ sigma(t)dW</text>

  <rect x="970" y="145" width="170" height="120" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1055" y="181" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#78350f">MNPS</text>
  <text x="1055" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#92400e">m, d, e</text>
  <text x="1055" y="238" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#92400e">measured chart</text>

  <path d="M 302 205 L 374 205" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 614 205 L 686 205" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 926 205 L 962 205" stroke="#1f2937" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="342" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">anti-phasic</text>
  <text x="650" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">gates</text>
  <text x="944" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">observed as</text>

  <rect x="130" y="360" width="940" height="190" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
  <text x="165" y="402" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#111827">Interpretation</text>
  <circle cx="177" cy="438" r="7" fill="#2563eb"/><text x="198" y="444" font-family="Arial, sans-serif" font-size="17" fill="#334155">Rhythms provide an observable schedule, not a hidden free parameter.</text>
  <circle cx="177" cy="475" r="7" fill="#dc2626"/><text x="198" y="481" font-family="Arial, sans-serif" font-size="17" fill="#334155">Low variance windows drive denoising; high variance windows permit exploration.</text>
  <circle cx="177" cy="512" r="7" fill="#16a34a"/><text x="198" y="518" font-family="Arial, sans-serif" font-size="17" fill="#334155">MNPS turns latent dynamics into testable trajectories, topology, and recurrence.</text>
</svg>
