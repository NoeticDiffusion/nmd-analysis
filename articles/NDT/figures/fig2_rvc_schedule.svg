<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Rhythmic variance control schedule</title>
  <desc id="desc">Event-locked rhythmic control is anti-phasic to variance and predicts step-wise entropy drops.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">Rhythmic Variance Control (RVC)</text>
  <text x="60" y="92" font-family="Arial, sans-serif" font-size="17" fill="#475569">High rhythm control tightens variance; entropy should fall after event-locked denoising epochs.</text>

  <line x1="100" y1="160" x2="1120" y2="160" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="300" x2="1120" y2="300" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="100" y1="440" x2="1120" y2="440" stroke="#cbd5e1" stroke-width="2"/>
  <text x="45" y="165" font-family="Arial, sans-serif" font-size="16" fill="#1e3a8a">r(t)</text>
  <text x="35" y="305" font-family="Arial, sans-serif" font-size="16" fill="#7f1d1d">sigma</text>
  <text x="42" y="445" font-family="Arial, sans-serif" font-size="16" fill="#166534">e(t)</text>

  <g fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" opacity="0.85">
    <rect x="220" y="112" width="70" height="360" rx="8"/>
    <rect x="480" y="112" width="90" height="360" rx="8"/>
    <rect x="780" y="112" width="75" height="360" rx="8"/>
  </g>
  <text x="255" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">event</text>
  <text x="525" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">event</text>
  <text x="817" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#1e3a8a">event</text>

  <polyline points="100,210 180,205 220,130 290,130 330,205 430,210 480,126 570,126 610,205 735,210 780,132 855,132 900,205 1120,210" fill="none" stroke="#2563eb" stroke-width="5" stroke-linejoin="round"/>
  <polyline points="100,342 180,345 220,410 290,410 330,345 430,340 480,418 570,418 610,345 735,342 780,408 855,408 900,345 1120,342" fill="none" stroke="#dc2626" stroke-width="5" stroke-linejoin="round"/>
  <polyline points="100,412 220,412 290,382 480,382 570,342 780,342 855,306 1120,306" fill="none" stroke="#16a34a" stroke-width="5" stroke-linejoin="round"/>

  <text x="255" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">denoise</text>
  <text x="525" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">denoise</text>
  <text x="817" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">denoise</text>
  <text x="1000" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">lower entropy plateau</text>
</svg>
