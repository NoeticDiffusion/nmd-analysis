<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Regime boundaries in later NDT work</title>
  <desc id="desc">Reduced capacity is separated from transport capture and pathological lock-in.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="60" y="58" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">Boundary: low capacity is not the same as unconsciousness</text>
  <text x="60" y="92" font-family="Arial, sans-serif" font-size="17" fill="#475569">Later extensions decompose regimes instead of collapsing them into one score.</text>

  <line x1="180" y1="510" x2="1020" y2="510" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="180" y1="510" x2="180" y2="145" stroke="#111827" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#111827">Transport capture / canalization</text>
  <text x="88" y="330" text-anchor="middle" transform="rotate(-90 88 330)" font-family="Arial, sans-serif" font-size="18" fill="#111827">Capacity / traversability</text>

  <circle cx="330" cy="300" r="54" fill="#dbeafe" stroke="#2563eb" stroke-width="3" filter="url(#shadow)"/>
  <text x="330" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#1e3a8a">Wake / REM</text>
  <text x="330" y="319" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#1e40af">higher capacity</text>

  <circle cx="335" cy="420" r="54" fill="#dcfce7" stroke="#16a34a" stroke-width="3" filter="url(#shadow)"/>
  <text x="335" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#14532d">N3 sleep</text>
  <text x="335" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#166534">low capacity</text>

  <circle cx="610" cy="430" r="58" fill="#fef3c7" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/>
  <text x="610" y="424" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#78350f">Propofol</text>
  <text x="610" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#92400e">arrest profile</text>

  <circle cx="865" cy="455" r="60" fill="#fee2e2" stroke="#dc2626" stroke-width="3" filter="url(#shadow)"/>
  <text x="865" y="449" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7f1d1d">Ictal</text>
  <text x="865" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">lock-in</text>

  <rect x="190" y="115" width="850" height="90" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="615" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#111827">Stage-1 NDT</text>
  <text x="615" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">Tests rhythm-locked denoising and MNPS geometry. Later extensions separate regime axes.</text>
</svg>
